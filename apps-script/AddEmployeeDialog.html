<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg-foundation: #F7F1EB;
        --surface-card: #FBF7F1;
        --surface-inset: #EFE8DD;
        --ink-primary: #2A2725;
        --ink-body: #4A4540;
        --ink-muted: #8A8178;
        --rule: #D4CFC4;
        --accent: #E91D79;
        --serif: 'Cormorant Garamond', Georgia, serif;
        --sans: 'Inter', system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-foundation);
        color: var(--ink-body);
        font: 14px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      form {
        padding: 28px 28px 0;
      }

      h2 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: -0.01em;
        color: var(--ink-primary);
        margin: 0 0 4px;
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin: 0 0 6px;
      }
      .section-head {
        margin-bottom: 18px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--rule);
      }
      .section {
        margin-top: 32px;
      }
      .section:first-of-type {
        margin-top: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 24px;
      }
      .field { min-width: 0; }

      label {
        display: block;
        margin-bottom: 6px;
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      input, select, textarea {
        width: 100%;
        min-height: 36px;
        border: 0;
        border-bottom: 1px solid var(--rule);
        border-radius: 0;
        padding: 6px 2px;
        background: transparent;
        font: inherit;
        font-size: 15px;
        color: var(--ink-primary);
        transition: border-color 120ms ease;
        font-variant-numeric: tabular-nums;
        appearance: none;
        -webkit-appearance: none;
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 5px;
      }
      textarea {
        min-height: 84px;
        resize: vertical;
      }
      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        min-height: auto;
        accent-color: var(--accent);
        cursor: pointer;
        padding: 0;
        border-bottom: none;
      }
      input[type="checkbox"]:focus {
        border-bottom: none;
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: 12px 8px;
        text-align: left;
        vertical-align: middle;
        border-bottom: 1px solid var(--rule);
      }
      thead th {
        border-top: 1px solid var(--rule);
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        background: var(--surface-inset);
      }
      tbody td {
        font-size: 14px;
        color: var(--ink-body);
        font-variant-numeric: tabular-nums;
      }
      td:first-child, th:first-child {
        width: 64px;
        padding-left: 14px;
      }
      td:nth-child(2), th:nth-child(2) {
        width: 64px;
        text-align: center;
      }
      td input[type="number"] {
        min-height: 30px;
        padding: 4px 2px;
      }
      td input[type="number"]:focus {
        padding-bottom: 3px;
      }
      .schedule-time { width: 100%; }
      .lunch-grid { margin-top: 20px; }
      .notes-field { margin-top: 32px; }

      .status {
        min-height: 22px;
        margin: 18px 0 0;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .error { color: var(--accent); }

      .actions {
        position: sticky;
        bottom: 0;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin: 28px -28px 0;
        padding: 18px 28px;
        border-top: 2px solid var(--accent);
        background: var(--bg-foundation);
      }
      button {
        min-height: 42px;
        padding: 0 22px;
        border: 1px solid var(--ink-primary);
        border-radius: 0;
        background: transparent;
        color: var(--ink-primary);
        font: inherit;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background-color 120ms ease, color 120ms ease;
      }
      button:hover:not(:disabled) {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      button.primary {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      button.primary:hover:not(:disabled) {
        background: var(--ink-primary);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <form id="employeeForm" onsubmit="submitForm(event)">
      <div class="section">
        <div class="section-head">
          <p class="eyebrow">Personnel Record</p>
          <h2>Employee</h2>
        </div>
        <div class="grid">
          <div class="field">
            <label for="fullName">Full Name</label>
            <input id="fullName" required oninput="suggestCode()">
          </div>
          <div class="field">
            <label for="displayName">Display Name</label>
            <input id="displayName">
          </div>
          <div class="field">
            <label for="employeeCode">Employee Code</label>
            <input id="employeeCode" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email">
          </div>
          <div class="field">
            <label for="position">Position</label>
            <input id="position">
          </div>
          <div class="field">
            <label for="manager">Manager</label>
            <input id="manager">
          </div>
          <div class="field">
            <label for="department">Department</label>
            <select id="department" required></select>
          </div>
          <div class="field">
            <label for="startDate">Start Date</label>
            <input id="startDate" type="date">
          </div>
          <div class="field">
            <label for="pin">Web App PIN</label>
            <input id="pin" autocomplete="new-password">
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <p class="eyebrow">Weekly Pattern</p>
          <h2>Work Schedule</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>Day</th>
              <th>Works</th>
              <th>Start</th>
              <th>End</th>
            </tr>
          </thead>
          <tbody id="scheduleRows"></tbody>
        </table>
        <div class="grid lunch-grid">
          <div class="field">
            <label for="lunchStart">Scheduled Lunch Start (Optional)</label>
            <input id="lunchStart" class="schedule-time" placeholder="01:00pm" pattern="[0-9]{2}:[0-9]{2}([aApP][mM])">
          </div>
          <div class="field">
            <label for="lunchEnd">Scheduled Lunch End (Optional)</label>
            <input id="lunchEnd" class="schedule-time" placeholder="02:00pm" pattern="[0-9]{2}:[0-9]{2}([aApP][mM])">
          </div>
        </div>
      </div>

      <div id="compSection" class="section">
        <div class="section-head">
          <p class="eyebrow">Pay &amp; Benefits</p>
          <h2>Compensation</h2>
        </div>
        <div class="grid">
          <div class="field">
            <label for="rampTier">Ramp Tier</label>
            <input id="rampTier">
          </div>
          <div class="field">
            <label for="monthlyBaseSalary">Monthly Base Salary</label>
            <input id="monthlyBaseSalary" type="number" min="0" step="0.01">
          </div>
          <div class="field">
            <label for="monthlyBenefits">Monthly Benefits</label>
            <input id="monthlyBenefits" type="number" min="0" step="0.01">
          </div>
          <div class="field">
            <label for="monthlyAttendanceBonus">Monthly Attendance Bonus</label>
            <input id="monthlyAttendanceBonus" type="number" min="0" step="0.01">
          </div>
          <div class="field">
            <label for="monthlyKpiBonusMax">Monthly KPI Bonus Max</label>
            <input id="monthlyKpiBonusMax" type="number" min="0" step="0.01">
          </div>
          <div class="field">
            <label for="quarterlyPaBonus">Quarterly PA Bonus</label>
            <input id="quarterlyPaBonus" type="number" min="0" step="0.01">
          </div>
          <div class="field">
            <label for="annualPtoDays">Annual PTO Hours</label>
            <input id="annualPtoDays" type="number" min="0" step="0.25">
          </div>
          <div class="field">
            <label for="ptoPlanType">PTO Plan Type</label>
            <select id="ptoPlanType"></select>
          </div>
          <div class="field">
            <label for="monthlyPtoAccrualDays">Monthly PTO Accrual Hours</label>
            <input id="monthlyPtoAccrualDays" type="number" min="0" step="0.25">
          </div>
          <div class="field">
            <label for="annualNonPtoDays">Annual Non-PTO Hours</label>
            <input id="annualNonPtoDays" type="number" min="0" step="0.25">
          </div>
        </div>
      </div>

      <div class="field notes-field">
        <label for="notes">Notes</label>
        <textarea id="notes"></textarea>
      </div>
      <p id="status" class="status"></p>

      <div class="actions">
        <button type="button" onclick="google.script.host.close()">Cancel</button>
        <button id="saveButton" class="primary" type="submit">Save Employee</button>
      </div>
    </form>

    <script>
      const INCLUDE_COMP = <?!= JSON.stringify(includeComp) ?>;
      const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

      function init() {
        document.getElementById('compSection').style.display = INCLUDE_COMP ? '' : 'none';
        document.getElementById('scheduleRows').innerHTML = DAYS.map(day => `
          <tr>
            <td>${day}</td>
            <td><input id="${day}Enabled" type="checkbox" ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].includes(day) ? 'checked' : ''}></td>
            <td><input id="${day}Start" class="schedule-time" value="10:00am" placeholder="10:00am" pattern="[0-9]{2}:[0-9]{2}([aApP][mM])"></td>
            <td><input id="${day}End" class="schedule-time" value="07:00pm" placeholder="07:00pm" pattern="[0-9]{2}:[0-9]{2}([aApP][mM])"></td>
          </tr>
        `).join('');
        google.script.run
          .withSuccessHandler(defaults => {
            document.getElementById('startDate').value = defaults.today || '';
            const departments = defaults.departments || ['Operations', 'HR', 'Marketing', 'Advertising'];
            document.getElementById('department').innerHTML = [''].concat(departments)
              .map(department => `<option value="${escapeAttr(department)}">${department ? escapeHtml(department) : 'Select department'}</option>`)
              .join('');
            const plans = defaults.ptoPlanTypes || ['Fixed Annual', 'Accrued Monthly'];
            document.getElementById('ptoPlanType').innerHTML = plans
              .map(plan => `<option value="${escapeAttr(plan)}">${escapeHtml(plan)}</option>`)
              .join('');
            document.getElementById('ptoPlanType').value = defaults.defaultPtoPlanType || 'Fixed Annual';
          })
          .getAddEmployeeDefaults();
      }

      function suggestCode() {
        const code = document.getElementById('employeeCode');
        if (code.value.trim()) return;
        const fullName = document.getElementById('fullName').value.trim();
        code.value = fullName.split(/\s+/)[0].toUpperCase().replace(/[^A-Z0-9_-]/g, '');
        const display = document.getElementById('displayName');
        if (!display.value.trim()) display.value = fullName.split(/\s+/)[0] || '';
      }

      function submitForm(event) {
        event.preventDefault();
        const payload = collectPayload();
        if (!payload.fullName || !payload.employeeCode || !payload.department) {
          setStatus('Full Name, Employee Code, and Department are required.', true);
          return;
        }
        setBusy(true);
        setStatus('Saving employee...');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Employee saved.');
            google.script.host.close();
          })
          .withFailureHandler(error => {
            setStatus(error && error.message ? error.message : String(error), true);
            setBusy(false);
          })
          .addEmployee(payload);
      }

      function collectPayload() {
        const schedule = {
          lunchStart: value('lunchStart'),
          lunchEnd: value('lunchEnd')
        };
        DAYS.forEach(day => {
          schedule[day] = {
            enabled: document.getElementById(`${day}Enabled`).checked,
            start: value(`${day}Start`),
            end: value(`${day}End`)
          };
        });
        return {
          includeComp: INCLUDE_COMP,
          fullName: value('fullName'),
          displayName: value('displayName'),
          employeeCode: value('employeeCode'),
          email: value('email'),
          position: value('position'),
          manager: value('manager'),
          department: value('department'),
          startDate: value('startDate'),
          pin: value('pin'),
          schedule,
          comp: INCLUDE_COMP ? {
            rampTier: value('rampTier'),
            monthlyBaseSalary: value('monthlyBaseSalary'),
            monthlyBenefits: value('monthlyBenefits'),
            monthlyAttendanceBonus: value('monthlyAttendanceBonus'),
            monthlyKpiBonusMax: value('monthlyKpiBonusMax'),
            quarterlyPaBonus: value('quarterlyPaBonus'),
            annualPtoDays: value('annualPtoDays'),
            annualNonPtoDays: value('annualNonPtoDays'),
            ptoPlanType: value('ptoPlanType'),
            monthlyPtoAccrualDays: value('monthlyPtoAccrualDays')
          } : {},
          notes: value('notes')
        };
      }

      function value(id) {
        return document.getElementById(id).value.trim();
      }

      function setBusy(isBusy) {
        document.getElementById('saveButton').disabled = isBusy;
      }

      function setStatus(message, isError) {
        const node = document.getElementById('status');
        node.textContent = message || '';
        node.className = isError ? 'status error' : 'status';
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#096;');
      }

      init();
    </script>
  </body>
</html>
