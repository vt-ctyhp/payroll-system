<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg-foundation: #F7F1EB;
        --surface-card: #FBF7F1;
        --surface-inset: #EFE8DD;
        --ink-primary: #2A2725;
        --ink-body: #4A4540;
        --ink-muted: #8A8178;
        --rule: #D4CFC4;
        --accent: #E91D79;
        --serif: 'Cormorant Garamond', Georgia, serif;
        --sans: 'Inter', system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-foundation);
        color: var(--ink-body);
        font: 14px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      form {
        padding: 28px 28px 0;
      }
      h2 {
        margin: 0 0 4px;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 22px;
        font-weight: 400;
      }
      .eyebrow,
      label,
      button {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .eyebrow,
      label {
        color: var(--ink-muted);
      }
      .section-head {
        margin-bottom: 18px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--rule);
      }
      .grid {
        display: grid;
        gap: 20px;
      }
      .adjustment-only {
        display: none;
      }
      label {
        display: block;
        margin-bottom: 6px;
      }
      select,
      input,
      textarea {
        width: 100%;
        min-height: 38px;
        border: 0;
        border-bottom: 1px solid var(--rule);
        border-radius: 0;
        padding: 6px 2px;
        background: transparent;
        color: var(--ink-primary);
        font: inherit;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        appearance: none;
        -webkit-appearance: none;
      }
      select:focus,
      input:focus,
      textarea:focus {
        outline: none;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 5px;
      }
      textarea {
        min-height: 94px;
        resize: vertical;
      }
      .status {
        min-height: 22px;
        margin: 18px 0 0;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .error { color: var(--accent); }
      .actions {
        position: sticky;
        bottom: 0;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin: 28px -28px 0;
        padding: 18px 28px;
        border-top: 2px solid var(--accent);
        background: var(--bg-foundation);
      }
      button {
        min-height: 42px;
        padding: 0 22px;
        border: 1px solid var(--ink-primary);
        border-radius: 0;
        background: transparent;
        color: var(--ink-primary);
        font-family: var(--sans);
        cursor: pointer;
      }
      button:hover:not(:disabled),
      button.primary {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <form onsubmit="submitForm(event)">
      <div class="section-head">
        <p id="eyebrow" class="eyebrow">Payroll Entry</p>
        <h2 id="title">Bonus / Adjustment</h2>
      </div>

      <div class="grid">
        <div>
          <label for="periodId">Pay Period</label>
          <select id="periodId" required></select>
        </div>
        <div>
          <label for="employeeCode">Employee</label>
          <select id="employeeCode" required></select>
        </div>
        <div class="adjustment-only">
          <label for="adjustmentType">Adjustment Type</label>
          <select id="adjustmentType">
            <option value="Positive Adj">Positive Adjustment</option>
            <option value="Negative Adj">Negative Adjustment</option>
          </select>
        </div>
        <div>
          <label for="amount">Amount</label>
          <input id="amount" type="number" min="0.01" step="0.01" required>
        </div>
        <div>
          <label for="description">Description</label>
          <textarea id="description" required placeholder="Approval reason, context, or reference"></textarea>
        </div>
      </div>

      <p id="status" class="status">Loading...</p>

      <div class="actions">
        <button type="button" onclick="google.script.host.close()">Cancel</button>
        <button id="saveButton" class="primary" type="submit">Save</button>
      </div>
    </form>

    <script>
      const ENTRY_MODE = <?!= JSON.stringify(entryMode) ?>;

      function init() {
        const isAdjustment = ENTRY_MODE === 'adjustment';
        document.getElementById('eyebrow').textContent = isAdjustment ? 'Payroll Adjustment' : 'Management Bonus';
        document.getElementById('title').textContent = isAdjustment ? 'Enter Adjustment' : 'Enter Additional Bonus';
        document.getElementById('saveButton').textContent = isAdjustment ? 'Save Adjustment' : 'Save Bonus';
        document.querySelectorAll('.adjustment-only').forEach(node => {
          node.style.display = isAdjustment ? 'block' : 'none';
        });

        google.script.run
          .withSuccessHandler(data => {
            document.getElementById('periodId').innerHTML = data.periods.map(period => {
              const label = `${period.periodId} | ${period.periodStart} to ${period.periodEnd} | ${period.status}`;
              return `<option value="${escapeAttr(period.periodId)}" ${period.periodId === data.defaultPeriodId ? 'selected' : ''}>${escapeHtml(label)}</option>`;
            }).join('');
            document.getElementById('employeeCode').innerHTML = data.employees
              .map(employee => `<option value="${escapeAttr(employee.employeeCode)}">${escapeHtml(employee.displayName)} (${escapeHtml(employee.employeeCode)})</option>`)
              .join('');
            setStatus('Ready.');
          })
          .withFailureHandler(showError)
          .getBonusAdjustmentDialogData(ENTRY_MODE);
      }

      function submitForm(event) {
        event.preventDefault();
        setBusy(true);
        setStatus('Saving entry.');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Saved.');
            setBusy(false);
          })
          .withFailureHandler(error => {
            showError(error);
            setBusy(false);
          })
          .addBonusAdjustment({
            entryMode: ENTRY_MODE,
            periodId: value('periodId'),
            employeeCode: value('employeeCode'),
            adjustmentType: value('adjustmentType'),
            amount: value('amount'),
            description: value('description')
          });
      }

      function value(id) {
        const node = document.getElementById(id);
        return node ? node.value.trim() : '';
      }

      function setBusy(isBusy) {
        document.getElementById('saveButton').disabled = isBusy;
      }

      function setStatus(message, isError) {
        const node = document.getElementById('status');
        node.textContent = message || '';
        node.className = isError ? 'status error' : 'status';
      }

      function showError(error) {
        setStatus(error && error.message ? error.message : String(error), true);
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#096;');
      }

      init();
    </script>
  </body>
</html>
