<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg-foundation: #F7F1EB;
        --surface-card: #FBF7F1;
        --surface-inset: #EFE8DD;
        --ink-primary: #2A2725;
        --ink-body: #4A4540;
        --ink-muted: #8A8178;
        --rule: #D4CFC4;
        --accent: #E91D79;
        --serif: 'Cormorant Garamond', Georgia, serif;
        --sans: 'Inter', system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-foundation);
        color: var(--ink-body);
        font: 15px/1.55 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(720px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      .panel {
        background: var(--surface-card);
        border: 1px solid var(--rule);
        padding: 36px 32px;
      }

      /* Masthead */
      .eyebrow {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin: 0;
      }
      h1 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 34px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--ink-primary);
        margin: 6px 0 0;
      }
      .date {
        margin-top: 18px;
      }
      .time {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 56px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--ink-primary);
        font-variant-numeric: tabular-nums;
        margin: 4px 0 0;
      }

      /* Divider */
      .rule {
        border: 0;
        border-top: 1px solid var(--rule);
        margin: 28px 0;
      }

      /* Current state callout */
      .state {
        background: var(--surface-inset);
        padding: 14px 18px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-primary);
      }
      .status-phrase {
        margin: 14px 0 0;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 22px;
        line-height: 1.18;
      }

      /* Buttons */
      .buttons {
        display: grid;
        gap: 10px;
        margin: 24px 0 0;
      }
      button {
        width: 100%;
        min-height: 52px;
        padding: 0 20px;
        border: 0;
        background: var(--ink-primary);
        color: var(--bg-foundation);
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
      }
      button:hover:not(:disabled) {
        background: var(--ink-primary);
      }
      button:disabled {
        cursor: not-allowed;
        background: var(--surface-inset);
        color: var(--ink-muted);
      }
      .secondary {
        background: transparent;
        color: var(--ink-primary);
        border: 1px solid var(--ink-primary);
        min-height: 44px;
        margin-top: 28px;
      }
      .secondary:hover:not(:disabled) {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }

      /* Today summary */
      .summary-heading {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin: 0 0 12px;
      }
      .summary {
        margin: 0;
        padding: 0;
        list-style: none;
        font-variant-numeric: tabular-nums;
      }
      .summary li {
        padding: 14px 0;
        border-top: 1px solid var(--rule);
        color: var(--ink-body);
        font-size: 14px;
      }
      .summary li:last-child {
        border-bottom: 1px solid var(--rule);
      }

      /* Form */
      label {
        display: block;
        margin: 24px 0 8px;
        color: var(--ink-muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      input,
      select,
      textarea {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-bottom: 1px solid var(--rule);
        background: transparent;
        padding: 0 2px;
        font: inherit;
        font-size: 16px;
        color: var(--ink-primary);
        transition: border-color 120ms ease;
      }
      select {
        appearance: none;
        -webkit-appearance: none;
      }
      textarea {
        min-height: 96px;
        padding-top: 8px;
        resize: vertical;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-bottom: 2px solid var(--ink-primary);
        padding-bottom: 0;
      }
      .utility-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 18px;
      }
      .utility-grid .secondary,
      .form-actions .secondary {
        margin-top: 0;
      }
      .balance-line {
        margin: 16px 0 0;
        padding-top: 14px;
        border-top: 1px solid var(--rule);
        color: var(--ink-muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .metric-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        margin: 18px 0 0;
      }
      .metric {
        padding: 14px 12px;
        border-right: 1px solid var(--rule);
      }
      .metric:last-child { border-right: 0; }
      .metric .label {
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .metric .value {
        margin-top: 4px;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 24px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        border: 1px solid var(--ink-primary);
        margin-top: 22px;
      }
      .segmented button {
        min-height: 42px;
        border-right: 1px solid var(--ink-primary);
        background: transparent;
        color: var(--ink-primary);
      }
      .segmented button:last-child { border-right: 0; }
      .segmented button.active {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      .timesheet-list {
        margin-top: 22px;
        border-top: 1px solid var(--rule);
      }
      .timesheet-row {
        padding: 18px 0;
        border-bottom: 1px solid var(--rule);
      }
      .timesheet-head {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: baseline;
      }
      .timesheet-date {
        margin: 0;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 22px;
        line-height: 1.1;
      }
      .timesheet-status {
        color: var(--ink-muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-align: right;
      }
      .timestamp-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px 18px;
        margin-top: 14px;
      }
      .timestamp .label {
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .timestamp .value {
        margin-top: 3px;
        color: var(--ink-primary);
        font-variant-numeric: tabular-nums;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      .chip {
        border: 1px solid var(--rule);
        padding: 5px 8px;
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .chip.issue {
        border-color: var(--accent);
        color: var(--accent);
      }
      .row-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 14px;
      }
      .compact {
        width: auto;
        min-height: 36px;
        padding: 0 14px;
        font-size: 10px;
      }
      .revision-form {
        margin-top: 18px;
        padding: 18px;
        background: var(--surface-inset);
        border-top: 1px solid var(--accent);
      }
      .form-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 24px;
      }
      .request-note {
        margin: 14px 0 0;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .empty {
        margin: 18px 0 0;
        padding: 18px;
        background: var(--surface-inset);
        border: 1px solid var(--rule);
        color: var(--ink-muted);
      }
      @media (max-width: 420px) {
        .utility-grid,
        .form-actions,
        .metric-strip,
        .timestamp-grid {
          grid-template-columns: 1fr;
        }
        .timesheet-head {
          display: block;
        }
        .timesheet-status {
          margin-top: 6px;
          text-align: left;
        }
      }

      /* Status / loading */
      .status {
        min-height: 22px;
        margin-top: 18px;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .error { color: var(--accent); }
      .loading {
        background: var(--surface-inset);
        padding: 18px 20px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-muted);
        text-align: center;
      }
      .intro {
        color: var(--ink-body);
        font-size: 15px;
        margin: 14px 0 0;
      }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <div id="app">
          <p class="loading">Loading clock state</p>
        </div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = 'payrollClockIdentity';
      const PHRASE_STORAGE_KEY = 'payrollClockStatusPhrase';
      const STATUS_PHRASES = {
        CLOCK_IN: [
          "There they are! Let's get it.",
          "Morning, superstar. Coffee's somewhere.",
          'Logged on and looking good.',
          'Look who decided to be amazing today.',
          "Clocking in like it's nothing. Iconic."
        ],
        LUNCH_START: [
          'Eat something that makes you happy.',
          'Go feed the genius.',
          'Soup. Sandwich. Salad. World is your oyster.',
          'The fridge has been waiting for you.',
          "Snack o'clock, baby."
        ],
        LUNCH_END: [
          'Welcome back, fed and formidable.',
          "Belly full. Brain online. Let's go.",
          'Okay okay okay \u2014 here we go.',
          'Reporting for duty, now with snacks digesting.',
          'Post-lunch you is the best you. Fact.'
        ],
        BREAK_START: [
          'Touch some grass. Or just the wall.',
          "Stretch like nobody's watching.",
          'Quick vibe check break.',
          "Go look at something that isn't a screen.",
          'Permission slip: do absolutely nothing.'
        ],
        BREAK_END: [
          "And we're so back.",
          'Okay, where were we.',
          'Back online. Beep boop.',
          'Reset complete. Vibes restored.',
          'The break was great. The comeback is greater.'
        ],
        CLOCK_OUT: [
          "That's a wrap! You crushed it today.",
          'Wrapping it up like a pro.',
          'Done done DONE. Enjoy your evening.',
          'Goodnight, MVP.',
          'Today happened and you were great in it. Goodnight.'
        ]
      };
      let latestState = null;
      let latestReview = null;
      let latestReviewMode = 'currentPeriod';
      let activeView = 'clock';

      function getIdentity() {
        try {
          return JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '{}');
        } catch (error) {
          return {};
        }
      }

      function setIdentity(identity) {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(identity || {}));
      }

      function clearIdentity() {
        sessionStorage.removeItem(STORAGE_KEY);
      }

      function loadState() {
        if (activeView !== 'clock') return;
        setStatus('Loading clock state...');
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(showError)
          .getClockAppInitialState(getIdentity());
      }

      function render(state) {
        activeView = 'clock';
        latestState = state;
        if (!state.authenticated) {
          renderIdentityForm(state);
          return;
        }

        const buttons = state.buttons.map(button => (
          `<button type="button" ${button.enabled ? '' : 'disabled'} onclick="submitEvent('${button.type}')">${escapeHtml(button.label)}</button>`
        )).join('');
        const summary = state.todaySummary.map(item => `<li>${escapeHtml(item)}</li>`).join('');
        const balance = renderBalanceLine(state.ptoBalance);
        const timesheetSummary = renderTimesheetSummaryLine(state.timesheetSummary);
        const phrase = pickStatusPhrase(state);

        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Time &amp; Attendance</p>
          <h1>Hi, ${escapeHtml(state.employee.displayName)}</h1>
          <p class="eyebrow date">${escapeHtml(state.dateLabel)}</p>
          <div class="time">${escapeHtml(state.timeLabel)}</div>
          <hr class="rule">
          <div class="state">${escapeHtml(state.currentState)}</div>
          ${phrase ? `<p class="status-phrase">${escapeHtml(phrase)}</p>` : ''}
          <div class="buttons">${buttons}</div>
          <div class="utility-grid">
            <button type="button" class="secondary" onclick="showTimeOffForm()">Request Time Off</button>
            <button type="button" class="secondary" onclick="showMakeupForm()">Makeup Hours</button>
            <button type="button" class="secondary" onclick="showTimesheetReview('currentPeriod')">Review Timesheet</button>
          </div>
          ${balance}
          ${timesheetSummary}
          <hr class="rule">
          <p class="summary-heading">Today so far</p>
          <ul class="summary">${summary}</ul>
          <p id="status" class="status"></p>
          <button type="button" class="secondary" onclick="signOut()">Sign out</button>
        `;
      }

      function renderIdentityForm(state) {
        activeView = 'clock';
        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Time &amp; Attendance</p>
          <h1>Employee Clock-In</h1>
          <p class="intro">${escapeHtml(state.message || 'Enter your employee code and PIN to continue.')}</p>
          <label for="employeeCode">Employee Code</label>
          <input id="employeeCode" autocomplete="username" inputmode="text">
          <label for="pin">Web App PIN</label>
          <input id="pin" type="password" autocomplete="current-password" inputmode="numeric">
          <div class="buttons">
            <button type="button" onclick="saveIdentity()">Continue</button>
          </div>
          <p id="status" class="status"></p>
        `;
      }

      function saveIdentity() {
        const employeeCode = document.getElementById('employeeCode').value.trim();
        const pin = document.getElementById('pin').value;
        if (!employeeCode || !pin) {
          setStatus('Enter both employee code and PIN.', true);
          return;
        }
        setIdentity({ employeeCode, pin });
        loadState();
      }

      function submitEvent(eventType) {
        disableButtons(true);
        setStatus('Saving...');
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(error => {
            showError(error);
            disableButtons(false);
          })
          .recordClockEvent({
            eventType,
            identity: getIdentity(),
            device: navigator.userAgent || ''
          });
      }

      function showTimeOffForm() {
        if (!latestState || !latestState.authenticated) return;
        activeView = 'timeOff';
        const today = getLocalDateInputValue();
        const typeOptions = (latestState.timeOffTypes || ['PTO', 'UTO', 'Non-PTO'])
          .map(type => `<option value="${escapeAttr(type)}">${escapeHtml(type)}</option>`)
          .join('');
        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Employee Request</p>
          <h1>Time Off</h1>
          <p class="request-note">Requests stay pending until a manager approves them.</p>
          ${renderBalanceLine(latestState.ptoBalance)}
          <label for="requestType">Type</label>
          <select id="requestType">${typeOptions}</select>
          <label for="startDate">Start Date</label>
          <input id="startDate" type="date" value="${escapeAttr(today)}">
          <label for="endDate">End Date</label>
          <input id="endDate" type="date" value="${escapeAttr(today)}">
          <label for="hoursDays">Hours / Days</label>
          <input id="hoursDays" type="number" min="0.25" step="0.25" inputmode="decimal">
          <label for="reason">Reason</label>
          <textarea id="reason"></textarea>
          <div class="form-actions">
            <button type="button" class="secondary" onclick="backToClock()">Cancel</button>
            <button id="submitRequestButton" type="button" onclick="submitTimeOffRequest()">Submit</button>
          </div>
          <p id="status" class="status"></p>
        `;
      }

      function showMakeupForm() {
        if (!latestState || !latestState.authenticated) return;
        activeView = 'makeup';
        const today = getLocalDateInputValue();
        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Employee Request</p>
          <h1>Makeup Hours</h1>
          <p class="request-note">Approved makeup hours offset short-hour deductions in payroll.</p>
          <label for="makeupDate">Date</label>
          <input id="makeupDate" type="date" value="${escapeAttr(today)}">
          <label for="makeupHours">Hours Requested</label>
          <input id="makeupHours" type="number" min="0.25" step="0.25" inputmode="decimal">
          <label for="makeupReason">Reason</label>
          <textarea id="makeupReason"></textarea>
          <div class="form-actions">
            <button type="button" class="secondary" onclick="backToClock()">Cancel</button>
            <button id="submitRequestButton" type="button" onclick="submitMakeupRequest()">Submit</button>
          </div>
          <p id="status" class="status"></p>
        `;
      }

      function showTimesheetReview(viewMode) {
        if (!latestState || !latestState.authenticated) return;
        activeView = 'timesheet';
        latestReviewMode = viewMode === 'recent' ? 'recent' : 'currentPeriod';
        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Timesheet Review</p>
          <h1>Review Timesheet</h1>
          <p class="loading">Loading timesheet</p>
          <p id="status" class="status"></p>
        `;
        google.script.run
          .withSuccessHandler(renderTimesheetReview)
          .withFailureHandler(showError)
          .getEmployeeTimesheetReview(getIdentity(), latestReviewMode);
      }

      function renderTimesheetReview(data) {
        activeView = 'timesheet';
        latestReview = data;
        latestReviewMode = data.viewMode || latestReviewMode;
        const rows = (data.rows || []).map((row, index) => renderTimesheetRow(row, index)).join('');
        const counts = data.counts || { openIssues: 0, pendingRevisions: 0, total: 0 };
        const currentActive = latestReviewMode === 'currentPeriod' ? 'active' : '';
        const recentActive = latestReviewMode === 'recent' ? 'active' : '';
        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Timesheet Review</p>
          <h1>${escapeHtml(data.employee ? data.employee.displayName : 'Review Timesheet')}</h1>
          <p class="request-note">${escapeHtml((data.selectedWindow && data.selectedWindow.label) || '')}</p>
          <div class="metric-strip">
            <div class="metric"><div class="label">Open Issues</div><div class="value">${escapeHtml(counts.openIssues || 0)}</div></div>
            <div class="metric"><div class="label">Pending Revisions</div><div class="value">${escapeHtml(counts.pendingRevisions || 0)}</div></div>
            <div class="metric"><div class="label">Total Flags</div><div class="value">${escapeHtml(counts.total || 0)}</div></div>
          </div>
          <div class="segmented">
            <button type="button" class="${currentActive}" onclick="showTimesheetReview('currentPeriod')">Current Period</button>
            <button type="button" class="${recentActive}" onclick="showTimesheetReview('recent')">Recent</button>
          </div>
          <div class="timesheet-list">${rows || '<p class="empty">No timesheet rows in this window.</p>'}</div>
          <div id="revisionFormHost"></div>
          <p id="status" class="status"></p>
          <button type="button" class="secondary" onclick="backToClock()">Back to Clock</button>
        `;
      }

      function renderTimesheetRow(row, index) {
        const issues = row.issues || [];
        const chips = issues.length
          ? issues.map(issue => `<span class="chip ${issue.isRevision ? '' : 'issue'}">${escapeHtml(issue.label)}</span>`).join('')
          : '<span class="chip">No flags</span>';
        const revision = row.revisionStatus ? `<span class="chip">${escapeHtml(row.revisionStatus)}</span>` : '';
        return `
          <article class="timesheet-row">
            <div class="timesheet-head">
              <div>
                <p class="timesheet-date">${escapeHtml(row.dateLabel || row.date)}</p>
                <p class="request-note">${escapeHtml(row.schedule || '')}</p>
              </div>
              <div class="timesheet-status">${escapeHtml(row.status || 'No status')}</div>
            </div>
            <div class="timestamp-grid">
              ${renderTimestampCell('Clock In', row.clockIn)}
              ${renderTimestampCell('Lunch Start', row.lunchStart)}
              ${renderTimestampCell('Lunch End', row.lunchEnd)}
              ${renderTimestampCell('Clock Out', row.clockOut)}
              ${renderTimestampCell('Worked', row.workedHours === '' ? '' : `${row.workedHours}h`)}
              ${renderTimestampCell('Late', row.lateMinutes === '' ? '' : `${row.lateMinutes}m`)}
              ${renderTimestampCell('Break 1', [row.break1Start, row.break1End].filter(Boolean).join(' - '))}
              ${renderTimestampCell('Break 2', [row.break2Start, row.break2End].filter(Boolean).join(' - '))}
            </div>
            <div class="chips">${chips}${revision}</div>
            <div class="row-actions">
              <button type="button" class="secondary compact" onclick="showRevisionForm(${index})">Request Revision</button>
            </div>
          </article>
        `;
      }

      function renderTimestampCell(label, value) {
        return `
          <div class="timestamp">
            <div class="label">${escapeHtml(label)}</div>
            <div class="value">${escapeHtml(value || 'blank')}</div>
          </div>
        `;
      }

      function showRevisionForm(rowIndex) {
        if (!latestReview || !latestReview.rows || !latestReview.rows[rowIndex]) return;
        const row = latestReview.rows[rowIndex];
        const selectedType = row.suggestedEventType || 'CLOCK_IN';
        const typeOptions = (latestReview.eventTypes || [])
          .map(item => `<option value="${escapeAttr(item.type)}" ${item.type === selectedType ? 'selected' : ''}>${escapeHtml(item.label)}</option>`)
          .join('');
        const eventOptions = renderOriginalEventOptions(row.events || []);
        document.getElementById('revisionFormHost').innerHTML = `
          <div class="revision-form">
            <p class="eyebrow">Timestamp Revision</p>
            <h1>${escapeHtml(row.dateLabel || row.date)}</h1>
            <input id="revisionDate" type="hidden" value="${escapeAttr(row.date)}">
            <label for="revisionType">Event Type</label>
            <select id="revisionType">${typeOptions}</select>
            <label for="originalEventId">Original Event</label>
            <select id="originalEventId">${eventOptions}</select>
            <label for="requestedTime">Requested Timestamp</label>
            <input id="requestedTime" placeholder="09:00am" inputmode="text">
            <label for="revisionReason">Reason</label>
            <textarea id="revisionReason"></textarea>
            <div class="form-actions">
              <button type="button" class="secondary" onclick="clearRevisionForm()">Cancel</button>
              <button id="submitRequestButton" type="button" onclick="submitTimestampRevisionRequest()">Submit</button>
            </div>
          </div>
        `;
        document.getElementById('revisionFormHost').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function renderOriginalEventOptions(events) {
        const rows = ['<option value="">Missing timestamp / no original event</option>'];
        events.forEach(event => {
          const label = `${event.eventLabel || event.eventType} ${event.timeLabel || event.timestamp}`;
          rows.push(`<option value="${escapeAttr(event.eventId)}">${escapeHtml(label)}</option>`);
        });
        return rows.join('');
      }

      function clearRevisionForm() {
        const host = document.getElementById('revisionFormHost');
        if (host) host.innerHTML = '';
      }

      function submitTimestampRevisionRequest() {
        const payload = {
          identity: getIdentity(),
          workDate: value('revisionDate'),
          eventType: value('revisionType'),
          originalEventId: value('originalEventId'),
          requestedTime: value('requestedTime'),
          reason: value('revisionReason')
        };
        if (!payload.workDate || !payload.eventType || !payload.requestedTime || !payload.reason) {
          setStatus('Complete every revision field before submitting.', true);
          return;
        }
        setRequestBusy(true);
        setStatus('Submitting revision...');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Revision submitted.');
            setRequestBusy(false);
            showTimesheetReview(latestReviewMode);
          })
          .withFailureHandler(error => {
            showError(error);
            setRequestBusy(false);
          })
          .submitTimestampRevisionRequest(payload);
      }

      function submitTimeOffRequest() {
        const payload = {
          identity: getIdentity(),
          type: value('requestType'),
          startDate: value('startDate'),
          endDate: value('endDate'),
          hoursDays: value('hoursDays'),
          reason: value('reason')
        };
        if (!payload.startDate || !payload.endDate || !payload.hoursDays || !payload.reason) {
          setStatus('Complete every field before submitting.', true);
          return;
        }
        setRequestBusy(true);
        setStatus('Submitting request...');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Request submitted.');
            setRequestBusy(false);
          })
          .withFailureHandler(error => {
            showError(error);
            setRequestBusy(false);
          })
          .submitWebTimeOffRequest(payload);
      }

      function submitMakeupRequest() {
        const payload = {
          identity: getIdentity(),
          date: value('makeupDate'),
          hoursRequested: value('makeupHours'),
          reason: value('makeupReason')
        };
        if (!payload.date || !payload.hoursRequested || !payload.reason) {
          setStatus('Complete every field before submitting.', true);
          return;
        }
        setRequestBusy(true);
        setStatus('Submitting request...');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Request submitted.');
            setRequestBusy(false);
          })
          .withFailureHandler(error => {
            showError(error);
            setRequestBusy(false);
          })
          .submitWebMakeupHourRequest(payload);
      }

      function backToClock() {
        activeView = 'clock';
        loadState();
      }

      function signOut() {
        activeView = 'clock';
        clearIdentity();
        latestState = null;
        loadState();
      }

      function disableButtons(disabled) {
        document.querySelectorAll('button').forEach(button => {
          if (!button.classList.contains('secondary')) button.disabled = disabled;
        });
      }

      function setRequestBusy(disabled) {
        const button = document.getElementById('submitRequestButton');
        if (button) button.disabled = disabled;
      }

      function value(id) {
        const node = document.getElementById(id);
        return node ? node.value.trim() : '';
      }

      function renderBalanceLine(balance) {
        if (!balance) return '';
        if (balance.unavailable) {
          return `<p class="balance-line">${escapeHtml(balance.message || 'PTO balance unavailable.')}</p>`;
        }
        const plan = balance.ptoPlanType || 'PTO';
        const earned = formatBalance(balance.earnedPto);
        const pto = formatBalance(balance.remainingPto);
        const nonPto = formatBalance(balance.remainingNonPto);
        return `<p class="balance-line">Current year balance: ${escapeHtml(plan)} PTO earned ${escapeHtml(earned)}, remaining ${escapeHtml(pto)} | Non-PTO ${escapeHtml(nonPto)}</p>`;
      }

      function renderTimesheetSummaryLine(summary) {
        if (!summary) return '';
        if (summary.unavailable) {
          return `<p class="balance-line">${escapeHtml(summary.message || 'Timesheet review unavailable.')}</p>`;
        }
        return `<p class="balance-line">Timesheet review: ${escapeHtml(summary.openIssues || 0)} open issue(s), ${escapeHtml(summary.pendingRevisions || 0)} pending revision(s).</p>`;
      }

      function pickStatusPhrase(state) {
        const eventType = state.lastEventType || 'CLOCK_IN';
        const phrases = STATUS_PHRASES[eventType] || [];
        if (!phrases.length) return '';
        const key = [
          state.employee && state.employee.employeeCode,
          state.dateLabel,
          eventType,
          (state.todaySummary || []).join('|')
        ].join('::');
        try {
          const cached = JSON.parse(sessionStorage.getItem(PHRASE_STORAGE_KEY) || '{}');
          if (cached.key === key && cached.phrase) return cached.phrase;
          const phrase = phrases[Math.floor(Math.random() * phrases.length)];
          sessionStorage.setItem(PHRASE_STORAGE_KEY, JSON.stringify({ key, phrase }));
          return phrase;
        } catch (error) {
          return phrases[Math.floor(Math.random() * phrases.length)];
        }
      }

      function formatBalance(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number.toFixed(2) : 'blank';
      }

      function getLocalDateInputValue() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        return now.toISOString().slice(0, 10);
      }

      function setStatus(message, isError) {
        const node = document.getElementById('status') || document.getElementById('app');
        if (!node) return;
        node.textContent = message || '';
        node.className = isError ? 'status error' : 'status';
      }

      function showError(error) {
        setStatus(error && error.message ? error.message : String(error), true);
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#096;');
      }

      loadState();
      setInterval(loadState, 60000);
    </script>
  </body>
</html>
