<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg-foundation: #F7F1EB;
        --surface-card: #FBF7F1;
        --surface-inset: #EFE8DD;
        --ink-primary: #2A2725;
        --ink-body: #4A4540;
        --ink-muted: #8A8178;
        --rule: #D4CFC4;
        --accent: #E91D79;
        --serif: 'Cormorant Garamond', Georgia, serif;
        --sans: 'Inter', system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-foundation);
        color: var(--ink-body);
        font: 15px/1.55 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(460px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      .panel {
        background: var(--surface-card);
        border: 1px solid var(--rule);
        padding: 36px 32px;
      }

      /* Masthead */
      .eyebrow {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin: 0;
      }
      h1 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 34px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--ink-primary);
        margin: 6px 0 0;
      }
      .date {
        margin-top: 18px;
      }
      .time {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 56px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--ink-primary);
        font-variant-numeric: tabular-nums;
        margin: 4px 0 0;
      }

      /* Divider */
      .rule {
        border: 0;
        border-top: 1px solid var(--rule);
        margin: 28px 0;
      }

      /* Current state callout */
      .state {
        background: var(--surface-inset);
        padding: 14px 18px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-primary);
      }

      /* Buttons */
      .buttons {
        display: grid;
        gap: 10px;
        margin: 24px 0 0;
      }
      button {
        width: 100%;
        min-height: 52px;
        padding: 0 20px;
        border: 0;
        background: var(--ink-primary);
        color: var(--bg-foundation);
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
      }
      button:hover:not(:disabled) {
        background: var(--ink-primary);
      }
      button:disabled {
        cursor: not-allowed;
        background: var(--surface-inset);
        color: var(--ink-muted);
      }
      .secondary {
        background: transparent;
        color: var(--ink-primary);
        border: 1px solid var(--ink-primary);
        min-height: 44px;
        margin-top: 28px;
      }
      .secondary:hover:not(:disabled) {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }

      /* Today summary */
      .summary-heading {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin: 0 0 12px;
      }
      .summary {
        margin: 0;
        padding: 0;
        list-style: none;
        font-variant-numeric: tabular-nums;
      }
      .summary li {
        padding: 14px 0;
        border-top: 1px solid var(--rule);
        color: var(--ink-body);
        font-size: 14px;
      }
      .summary li:last-child {
        border-bottom: 1px solid var(--rule);
      }

      /* Form */
      label {
        display: block;
        margin: 24px 0 8px;
        color: var(--ink-muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      input,
      select,
      textarea {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-bottom: 1px solid var(--rule);
        background: transparent;
        padding: 0 2px;
        font: inherit;
        font-size: 16px;
        color: var(--ink-primary);
        transition: border-color 120ms ease;
      }
      select {
        appearance: none;
        -webkit-appearance: none;
      }
      textarea {
        min-height: 96px;
        padding-top: 8px;
        resize: vertical;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-bottom: 2px solid var(--ink-primary);
        padding-bottom: 0;
      }
      .utility-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }
      .utility-grid .secondary,
      .form-actions .secondary {
        margin-top: 0;
      }
      .balance-line {
        margin: 16px 0 0;
        padding-top: 14px;
        border-top: 1px solid var(--rule);
        color: var(--ink-muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .form-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 24px;
      }
      .request-note {
        margin: 14px 0 0;
        color: var(--ink-muted);
        font-size: 13px;
      }
      @media (max-width: 420px) {
        .utility-grid,
        .form-actions {
          grid-template-columns: 1fr;
        }
      }

      /* Status / loading */
      .status {
        min-height: 22px;
        margin-top: 18px;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .error { color: var(--accent); }
      .loading {
        background: var(--surface-inset);
        padding: 18px 20px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-muted);
        text-align: center;
      }
      .intro {
        color: var(--ink-body);
        font-size: 15px;
        margin: 14px 0 0;
      }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <div id="app">
          <p class="loading">Loading clock state</p>
        </div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = 'payrollClockIdentity';
      let latestState = null;
      let activeView = 'clock';

      function getIdentity() {
        try {
          return JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '{}');
        } catch (error) {
          return {};
        }
      }

      function setIdentity(identity) {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(identity || {}));
      }

      function clearIdentity() {
        sessionStorage.removeItem(STORAGE_KEY);
      }

      function loadState() {
        if (activeView !== 'clock') return;
        setStatus('Loading clock state...');
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(showError)
          .getClockAppInitialState(getIdentity());
      }

      function render(state) {
        activeView = 'clock';
        latestState = state;
        if (!state.authenticated) {
          renderIdentityForm(state);
          return;
        }

        const buttons = state.buttons.map(button => (
          `<button type="button" ${button.enabled ? '' : 'disabled'} onclick="submitEvent('${button.type}')">${escapeHtml(button.label)}</button>`
        )).join('');
        const summary = state.todaySummary.map(item => `<li>${escapeHtml(item)}</li>`).join('');
        const balance = renderBalanceLine(state.ptoBalance);

        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Time &amp; Attendance</p>
          <h1>Hi, ${escapeHtml(state.employee.displayName)}</h1>
          <p class="eyebrow date">${escapeHtml(state.dateLabel)}</p>
          <div class="time">${escapeHtml(state.timeLabel)}</div>
          <hr class="rule">
          <div class="state">${escapeHtml(state.currentState)}</div>
          <div class="buttons">${buttons}</div>
          <div class="utility-grid">
            <button type="button" class="secondary" onclick="showTimeOffForm()">Request Time Off</button>
            <button type="button" class="secondary" onclick="showMakeupForm()">Makeup Hours</button>
          </div>
          ${balance}
          <hr class="rule">
          <p class="summary-heading">Today so far</p>
          <ul class="summary">${summary}</ul>
          <p id="status" class="status"></p>
          <button type="button" class="secondary" onclick="signOut()">Sign out</button>
        `;
      }

      function renderIdentityForm(state) {
        activeView = 'clock';
        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Time &amp; Attendance</p>
          <h1>Employee Clock-In</h1>
          <p class="intro">${escapeHtml(state.message || 'Enter your employee code and PIN to continue.')}</p>
          <label for="employeeCode">Employee Code</label>
          <input id="employeeCode" autocomplete="username" inputmode="text">
          <label for="pin">Web App PIN</label>
          <input id="pin" type="password" autocomplete="current-password" inputmode="numeric">
          <div class="buttons">
            <button type="button" onclick="saveIdentity()">Continue</button>
          </div>
          <p id="status" class="status"></p>
        `;
      }

      function saveIdentity() {
        const employeeCode = document.getElementById('employeeCode').value.trim();
        const pin = document.getElementById('pin').value;
        if (!employeeCode || !pin) {
          setStatus('Enter both employee code and PIN.', true);
          return;
        }
        setIdentity({ employeeCode, pin });
        loadState();
      }

      function submitEvent(eventType) {
        disableButtons(true);
        setStatus('Saving...');
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(error => {
            showError(error);
            disableButtons(false);
          })
          .recordClockEvent({
            eventType,
            identity: getIdentity(),
            device: navigator.userAgent || ''
          });
      }

      function showTimeOffForm() {
        if (!latestState || !latestState.authenticated) return;
        activeView = 'timeOff';
        const today = getLocalDateInputValue();
        const typeOptions = (latestState.timeOffTypes || ['PTO', 'UTO', 'Non-PTO'])
          .map(type => `<option value="${escapeAttr(type)}">${escapeHtml(type)}</option>`)
          .join('');
        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Employee Request</p>
          <h1>Time Off</h1>
          <p class="request-note">Requests stay pending until a manager approves them.</p>
          <label for="requestType">Type</label>
          <select id="requestType">${typeOptions}</select>
          <label for="startDate">Start Date</label>
          <input id="startDate" type="date" value="${escapeAttr(today)}">
          <label for="endDate">End Date</label>
          <input id="endDate" type="date" value="${escapeAttr(today)}">
          <label for="hoursDays">Hours / Days</label>
          <input id="hoursDays" type="number" min="0.25" step="0.25" inputmode="decimal">
          <label for="reason">Reason</label>
          <textarea id="reason"></textarea>
          <div class="form-actions">
            <button type="button" class="secondary" onclick="backToClock()">Cancel</button>
            <button id="submitRequestButton" type="button" onclick="submitTimeOffRequest()">Submit</button>
          </div>
          <p id="status" class="status"></p>
        `;
      }

      function showMakeupForm() {
        if (!latestState || !latestState.authenticated) return;
        activeView = 'makeup';
        const today = getLocalDateInputValue();
        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Employee Request</p>
          <h1>Makeup Hours</h1>
          <p class="request-note">Approved makeup hours offset short-hour deductions in payroll.</p>
          <label for="makeupDate">Date</label>
          <input id="makeupDate" type="date" value="${escapeAttr(today)}">
          <label for="makeupHours">Hours Requested</label>
          <input id="makeupHours" type="number" min="0.25" step="0.25" inputmode="decimal">
          <label for="makeupReason">Reason</label>
          <textarea id="makeupReason"></textarea>
          <div class="form-actions">
            <button type="button" class="secondary" onclick="backToClock()">Cancel</button>
            <button id="submitRequestButton" type="button" onclick="submitMakeupRequest()">Submit</button>
          </div>
          <p id="status" class="status"></p>
        `;
      }

      function submitTimeOffRequest() {
        const payload = {
          identity: getIdentity(),
          type: value('requestType'),
          startDate: value('startDate'),
          endDate: value('endDate'),
          hoursDays: value('hoursDays'),
          reason: value('reason')
        };
        if (!payload.startDate || !payload.endDate || !payload.hoursDays || !payload.reason) {
          setStatus('Complete every field before submitting.', true);
          return;
        }
        setRequestBusy(true);
        setStatus('Submitting request...');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Request submitted.');
            setRequestBusy(false);
          })
          .withFailureHandler(error => {
            showError(error);
            setRequestBusy(false);
          })
          .submitWebTimeOffRequest(payload);
      }

      function submitMakeupRequest() {
        const payload = {
          identity: getIdentity(),
          date: value('makeupDate'),
          hoursRequested: value('makeupHours'),
          reason: value('makeupReason')
        };
        if (!payload.date || !payload.hoursRequested || !payload.reason) {
          setStatus('Complete every field before submitting.', true);
          return;
        }
        setRequestBusy(true);
        setStatus('Submitting request...');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Request submitted.');
            setRequestBusy(false);
          })
          .withFailureHandler(error => {
            showError(error);
            setRequestBusy(false);
          })
          .submitWebMakeupHourRequest(payload);
      }

      function backToClock() {
        activeView = 'clock';
        loadState();
      }

      function signOut() {
        activeView = 'clock';
        clearIdentity();
        latestState = null;
        loadState();
      }

      function disableButtons(disabled) {
        document.querySelectorAll('button').forEach(button => {
          if (!button.classList.contains('secondary')) button.disabled = disabled;
        });
      }

      function setRequestBusy(disabled) {
        const button = document.getElementById('submitRequestButton');
        if (button) button.disabled = disabled;
      }

      function value(id) {
        const node = document.getElementById(id);
        return node ? node.value.trim() : '';
      }

      function renderBalanceLine(balance) {
        if (!balance) return '';
        const pto = formatBalance(balance.remainingPto);
        const nonPto = formatBalance(balance.remainingNonPto);
        return `<p class="balance-line">Current year balance: PTO ${escapeHtml(pto)} | Non-PTO ${escapeHtml(nonPto)}</p>`;
      }

      function formatBalance(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number.toFixed(2) : 'blank';
      }

      function getLocalDateInputValue() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        return now.toISOString().slice(0, 10);
      }

      function setStatus(message, isError) {
        const node = document.getElementById('status') || document.getElementById('app');
        if (!node) return;
        node.textContent = message || '';
        node.className = isError ? 'status error' : 'status';
      }

      function showError(error) {
        setStatus(error && error.message ? error.message : String(error), true);
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#096;');
      }

      loadState();
      setInterval(loadState, 60000);
    </script>
  </body>
</html>
