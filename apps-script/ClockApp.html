<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg-foundation: #F7F1EB;
        --surface-card: #FBF7F1;
        --surface-inset: #EFE8DD;
        --ink-primary: #2A2725;
        --ink-body: #4A4540;
        --ink-muted: #8A8178;
        --rule: #D4CFC4;
        --accent: #E91D79;
        --serif: 'Cormorant Garamond', Georgia, serif;
        --sans: 'Inter', system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-foundation);
        color: var(--ink-body);
        font: 15px/1.55 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(720px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      .panel {
        background: var(--surface-card);
        border: 1px solid var(--rule);
        padding: 36px 32px;
      }
      body.admin-mode main {
        width: min(1360px, 100%);
      }
      body.admin-mode .panel {
        padding: 42px 44px;
        overflow-x: hidden;
      }

      /* Masthead */
      .eyebrow {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin: 0;
      }
      h1 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 34px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--ink-primary);
        margin: 6px 0 0;
      }
      .date {
        margin-top: 18px;
      }
      .time {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 56px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--ink-primary);
        font-variant-numeric: tabular-nums;
        margin: 4px 0 0;
      }

      /* Divider */
      .rule {
        border: 0;
        border-top: 1px solid var(--rule);
        margin: 28px 0;
      }

      /* Current state callout */
      .state {
        background: var(--surface-inset);
        padding: 14px 18px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-primary);
      }
      .status-phrase {
        margin: 14px 0 0;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 22px;
        line-height: 1.18;
      }

      /* Buttons */
      .buttons {
        display: grid;
        gap: 10px;
        margin: 24px 0 0;
      }
      button {
        width: 100%;
        min-height: 52px;
        padding: 0 20px;
        border: 0;
        background: var(--ink-primary);
        color: var(--bg-foundation);
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
      }
      button:hover:not(:disabled) {
        background: var(--ink-primary);
      }
      button:disabled {
        cursor: not-allowed;
        background: var(--surface-inset);
        color: var(--ink-muted);
      }
      .secondary {
        background: transparent;
        color: var(--ink-primary);
        border: 1px solid var(--ink-primary);
        min-height: 44px;
        margin-top: 28px;
      }
      .secondary:hover:not(:disabled) {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }

      /* Today summary */
      .summary-heading {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin: 0 0 12px;
      }
      .summary {
        margin: 0;
        padding: 0;
        list-style: none;
        font-variant-numeric: tabular-nums;
      }
      .summary li {
        padding: 14px 0;
        border-top: 1px solid var(--rule);
        color: var(--ink-body);
        font-size: 14px;
      }
      .summary li:last-child {
        border-bottom: 1px solid var(--rule);
      }

      /* Form */
      label {
        display: block;
        margin: 24px 0 8px;
        color: var(--ink-muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      input,
      select,
      textarea {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-bottom: 1px solid var(--rule);
        background: transparent;
        padding: 0 2px;
        font: inherit;
        font-size: 16px;
        color: var(--ink-primary);
        transition: border-color 120ms ease;
      }
      input[type="checkbox"] {
        width: 16px;
        min-height: auto;
        height: 16px;
        margin: 0 8px 0 0;
        accent-color: var(--accent);
        vertical-align: middle;
      }
      input:disabled {
        color: var(--ink-muted);
      }
      .checkbox-line {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      select {
        appearance: none;
        -webkit-appearance: none;
      }
      textarea {
        min-height: 96px;
        padding-top: 8px;
        resize: vertical;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 0;
      }
      .utility-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 18px;
      }
      .utility-grid .secondary,
      .form-actions .secondary {
        margin-top: 0;
      }
      .balance-line {
        margin: 16px 0 0;
        padding-top: 14px;
        border-top: 1px solid var(--rule);
        color: var(--ink-muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .timesheet-alert {
        margin: 18px 0 0;
        padding: 16px 0 18px;
        border-top: 2px solid var(--accent);
        border-bottom: 1px solid var(--rule);
      }
      .timesheet-alert-label {
        margin: 0 0 8px;
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .timesheet-alert-title {
        margin: 0;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 24px;
        line-height: 1.1;
      }
      .timesheet-alert-copy {
        margin: 10px 0 0;
        color: var(--ink-body);
        font-size: 13px;
      }
      .timesheet-alert button {
        margin-top: 14px;
        min-height: 42px;
        border: 1px solid var(--ink-primary);
        background: transparent;
        color: var(--ink-primary);
      }
      .timesheet-alert button:hover:not(:disabled) {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--bg-foundation);
      }
      .metric-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        margin: 18px 0 0;
      }
      .metric-strip.two {
        grid-template-columns: repeat(2, 1fr);
      }
      .metric {
        padding: 14px 12px;
        border-right: 1px solid var(--rule);
      }
      .metric:last-child { border-right: 0; }
      .metric .label {
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .metric .value {
        margin-top: 4px;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 24px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        border: 1px solid var(--ink-primary);
        margin-top: 22px;
      }
      .segmented button {
        min-height: 42px;
        border-right: 1px solid var(--ink-primary);
        background: transparent;
        color: var(--ink-primary);
      }
      .segmented button:hover:not(:disabled) {
        background: var(--accent);
        color: var(--bg-foundation);
        border-color: var(--accent);
      }
      .segmented button:last-child { border-right: 0; }
      .segmented button.active {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      .timesheet-list {
        margin-top: 22px;
        border-top: 1px solid var(--rule);
      }
      .timesheet-row {
        padding: 18px 0;
        border-bottom: 1px solid var(--rule);
      }
      .timesheet-head {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: baseline;
      }
      .timesheet-date {
        margin: 0;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 22px;
        line-height: 1.1;
      }
      .timesheet-status {
        color: var(--ink-muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-align: right;
      }
      .timestamp-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px 18px;
        margin-top: 14px;
      }
      .timestamp .label {
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .timestamp .value {
        margin-top: 3px;
        color: var(--ink-primary);
        font-variant-numeric: tabular-nums;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      .chip {
        border: 1px solid var(--rule);
        padding: 5px 8px;
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .chip.issue {
        border-color: var(--accent);
        color: var(--accent);
      }
      .row-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 14px;
      }
      .compact {
        width: auto;
        min-height: 36px;
        padding: 0 14px;
        font-size: 10px;
      }
      .revision-form {
        margin-top: 18px;
        padding: 18px;
        background: var(--surface-inset);
        border-top: 1px solid var(--accent);
      }
      .form-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 24px;
      }
      .request-note {
        margin: 14px 0 0;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .empty {
        margin: 18px 0 0;
        padding: 18px;
        background: var(--surface-inset);
        border: 1px solid var(--rule);
        color: var(--ink-muted);
      }
      @media (max-width: 420px) {
        .utility-grid,
        .form-actions,
        .metric-strip,
        .timestamp-grid {
          grid-template-columns: 1fr;
        }
        .timesheet-head {
          display: block;
        }
        .timesheet-status {
          margin-top: 6px;
          text-align: left;
        }
      }

      /* Status / loading */
      .status {
        min-height: 22px;
        margin-top: 18px;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .error { color: var(--accent); }
      .loading {
        background: var(--surface-inset);
        padding: 18px 20px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-muted);
        text-align: center;
      }
      .intro {
        color: var(--ink-body);
        font-size: 15px;
        margin: 14px 0 0;
      }
      .hidden { display: none; }

      /* Admin dashboard */
      .dashboard-shell {
        display: grid;
        gap: 28px;
        max-width: 100%;
        min-width: 0;
      }
      #adminContent {
        max-width: 100%;
        min-width: 0;
      }
      .dashboard-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
        align-items: end;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 22px;
      }
      .dashboard-meta {
        color: var(--ink-muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .dashboard-logout {
        width: auto;
        min-height: 38px;
        margin-top: 12px;
        padding: 0 16px;
        border: 1px solid var(--ink-primary);
        background: transparent;
        color: var(--ink-primary);
        font-size: 11px;
      }
      .dashboard-logout:hover:not(:disabled) {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      .dashboard-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
      }
      .dashboard-nav button {
        width: auto;
        min-height: 46px;
        border: 0;
        border-right: 1px solid var(--rule);
        background: transparent;
        color: var(--ink-primary);
      }
      .dashboard-nav button:hover:not(:disabled) {
        background: var(--accent);
        color: var(--bg-foundation);
      }
      .dashboard-nav button.active {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
      }
      .dashboard-tile {
        padding: 20px 18px;
        border-right: 1px solid var(--rule);
      }
      .dashboard-tile:last-child {
        border-right: 0;
      }
      .dashboard-tile .label,
      .admin-list-label {
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .dashboard-tile .value {
        margin-top: 8px;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 42px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .dashboard-section {
        border-top: 1px solid var(--rule);
        padding-top: 24px;
        max-width: 100%;
        min-width: 0;
      }
      .dashboard-section h2 {
        margin: 0 0 18px;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 30px;
        font-weight: 400;
        line-height: 1.05;
      }
      .admin-columns {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
      }
      .admin-list {
        border-top: 1px solid var(--rule);
      }
      .admin-list-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        padding: 14px 0;
        border-bottom: 1px solid var(--rule);
      }
      .admin-list-row strong {
        color: var(--ink-primary);
        font-weight: 500;
      }
      .admin-list-row small {
        display: block;
        margin-top: 4px;
        color: var(--ink-muted);
      }
      .admin-actions-grid,
      .data-selector-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        max-width: 100%;
        min-width: 0;
      }
      .data-selector-grid {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }
      .admin-actions-grid button,
      .data-selector-grid button {
        background: transparent;
        color: var(--ink-primary);
        border: 1px solid var(--ink-primary);
      }
      .admin-actions-grid button:hover:not(:disabled),
      .data-selector-grid button:hover:not(:disabled) {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg-foundation);
      }
      .data-table-wrap {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        max-height: 560px;
        overflow: auto;
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
      }
      .data-table {
        width: max-content;
        min-width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .data-table th,
      .data-table td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--rule);
        text-align: left;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .data-table th {
        position: sticky;
        top: 0;
        background: var(--surface-inset);
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .action-panel {
        margin-top: 24px;
        padding: 24px;
        background: var(--surface-inset);
        border-top: 2px solid var(--accent);
      }
      .action-panel h2 {
        margin-top: 0;
      }
      .admin-form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0 22px;
      }
      .admin-workflow-section {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--rule);
      }
      .admin-workflow-section h3 {
        margin: 0 0 4px;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 400;
        line-height: 1.1;
      }
      .admin-schedule-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }
      .admin-schedule-table th,
      .admin-schedule-table td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--rule);
        text-align: left;
      }
      .admin-schedule-table th {
        background: var(--surface-card);
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .data-controls {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) 120px auto auto;
        gap: 10px;
        align-items: end;
        margin: 18px 0 16px;
      }
      .data-controls .secondary {
        margin-top: 0;
      }
      .admin-check-list {
        max-height: 240px;
        overflow: auto;
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        padding: 8px 0;
      }
      .admin-check-list label {
        margin: 0;
        padding: 8px 0;
        font-size: 12px;
        letter-spacing: 0.08em;
      }
      @media (max-width: 820px) {
        body.admin-mode .panel {
          padding: 32px 24px;
        }
        .dashboard-head,
        .admin-columns,
        .admin-form-grid,
        .data-controls,
        .dashboard-grid,
        .admin-actions-grid,
        .data-selector-grid {
          grid-template-columns: 1fr;
        }
        .dashboard-meta {
          text-align: left;
        }
        .dashboard-logout {
          width: 100%;
        }
        .dashboard-tile {
          border-right: 0;
          border-bottom: 1px solid var(--rule);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <div id="app">
          <p class="loading">Loading clock state</p>
        </div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = 'payrollClockIdentity';
      const PHRASE_STORAGE_KEY = 'payrollClockStatusPhrase';
      const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const STATUS_PHRASES = {
        CLOCK_IN: [
          "There they are! Let's get it.",
          "Morning, superstar. Coffee's somewhere.",
          'Logged on and looking good.',
          'Look who decided to be amazing today.',
          "Clocking in like it's nothing. Iconic."
        ],
        LUNCH_START: [
          'Eat something that makes you happy.',
          'Go feed the genius.',
          'Soup. Sandwich. Salad. World is your oyster.',
          'The fridge has been waiting for you.',
          "Snack o'clock, baby."
        ],
        LUNCH_END: [
          'Welcome back, fed and formidable.',
          "Belly full. Brain online. Let's go.",
          'Okay okay okay \u2014 here we go.',
          'Reporting for duty, now with snacks digesting.',
          'Post-lunch you is the best you. Fact.'
        ],
        BREAK_START: [
          'Touch some grass. Or just the wall.',
          "Stretch like nobody's watching.",
          'Quick vibe check break.',
          "Go look at something that isn't a screen.",
          'Permission slip: do absolutely nothing.'
        ],
        BREAK_END: [
          "And we're so back.",
          'Okay, where were we.',
          'Back online. Beep boop.',
          'Reset complete. Vibes restored.',
          'The break was great. The comeback is greater.'
        ],
        CLOCK_OUT: [
          "That's a wrap! You crushed it today.",
          'Wrapping it up like a pro.',
          'Done done DONE. Enjoy your evening.',
          'Goodnight, MVP.',
          'Today happened and you were great in it. Goodnight.'
        ]
      };
      let latestState = null;
      let latestReview = null;
      let latestReviewMode = 'currentPeriod';
      let activeView = 'clock';
      let adminState = null;
      let adminView = 'overview';
      let activeDataTab = '';
      let activeDataQuery = '';
      let activeDataOffset = 0;
      let activeDataLimit = 100;
      let adminTimeOffBalances = {};
      let adminTimeOffPreviewTimer = null;
      let loginMode = 'employee';

      function getIdentity() {
        try {
          return JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '{}');
        } catch (error) {
          return {};
        }
      }

      function setIdentity(identity) {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(identity || {}));
      }

      function clearIdentity() {
        sessionStorage.removeItem(STORAGE_KEY);
      }

      function loadState() {
        if (activeView !== 'clock' && activeView !== 'admin') return;
        setStatus('Loading clock state...');
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(showError)
          .getClockAppInitialState(getIdentity());
      }

      function render(state) {
        latestState = state;
        document.body.classList.remove('admin-mode');
        if (!state.authenticated) {
          activeView = 'clock';
          renderIdentityForm(state);
          return;
        }
        if (state.mode === 'admin') {
          renderAdminPortal(state);
          return;
        }

        activeView = 'clock';
        const buttons = state.buttons.map(button => (
          `<button type="button" ${button.enabled ? '' : 'disabled'} onclick="submitEvent('${button.type}')">${escapeHtml(button.label)}</button>`
        )).join('');
        const summary = state.todaySummary.map(item => `<li>${escapeHtml(item)}</li>`).join('');
        const balance = renderBalanceLine(state.ptoBalance);
        const timesheetNotice = renderTimesheetDashboardNotice(state.timesheetSummary);
        const phrase = pickStatusPhrase(state);

        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Time &amp; Attendance</p>
          <h1>Hi, ${escapeHtml(state.employee.displayName)}</h1>
          <p class="eyebrow date">${escapeHtml(state.dateLabel)}</p>
          <div class="time">${escapeHtml(state.timeLabel)}</div>
          <hr class="rule">
          <div class="state">${escapeHtml(state.currentState)}</div>
          ${phrase ? `<p class="status-phrase">${escapeHtml(phrase)}</p>` : ''}
          <div class="buttons">${buttons}</div>
          ${timesheetNotice}
          <div class="utility-grid">
            <button type="button" class="secondary" onclick="showTimeOffForm()">Request Time Off</button>
            <button type="button" class="secondary" onclick="showMakeupForm()">Makeup Hours</button>
            <button type="button" class="secondary" onclick="showTimesheetReview('currentPeriod')">Review Timesheet</button>
          </div>
          ${balance}
          <hr class="rule">
          <p class="summary-heading">Today so far</p>
          <ul class="summary">${summary}</ul>
          <p id="status" class="status"></p>
          <button type="button" class="secondary" onclick="signOut()">Sign out</button>
        `;
      }

      function renderIdentityForm(state) {
        activeView = 'clock';
        document.body.classList.remove('admin-mode');
        const storedIdentity = getIdentity();
        if (storedIdentity.loginMode === 'admin') loginMode = 'admin';
        const isAdmin = loginMode === 'admin';
        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Time &amp; Attendance</p>
          <h1>${isAdmin ? 'Admin Dashboard' : 'Employee Clock-In'}</h1>
          <p class="intro">${escapeHtml(state.message || (isAdmin ? 'Enter your admin email and access key.' : 'Enter your employee code and PIN to continue.'))}</p>
          <div class="segmented">
            <button type="button" class="${isAdmin ? '' : 'active'}" onclick="switchLoginMode('employee')">Employee</button>
            <button type="button" class="${isAdmin ? 'active' : ''}" onclick="switchLoginMode('admin')">Admin</button>
          </div>
          ${isAdmin ? `
            <label for="adminEmail">Admin Email</label>
            <input id="adminEmail" autocomplete="username" inputmode="email">
            <label for="adminKey">Admin Access Key</label>
            <input id="adminKey" type="password" autocomplete="current-password">
          ` : `
            <label for="employeeCode">Employee Code</label>
            <input id="employeeCode" autocomplete="username" inputmode="text">
            <label for="pin">Web App PIN</label>
            <input id="pin" type="password" autocomplete="current-password" inputmode="numeric">
          `}
          <div class="buttons">
            <button type="button" onclick="saveIdentity()">Continue</button>
          </div>
          <p id="status" class="status"></p>
        `;
      }

      function switchLoginMode(mode) {
        loginMode = mode === 'admin' ? 'admin' : 'employee';
        clearIdentity();
        renderIdentityForm({
          authenticated: false,
          message: loginMode === 'admin'
            ? 'Enter your admin email and access key.'
            : 'Enter your employee code and PIN to continue.'
        });
      }

      function saveIdentity() {
        if (loginMode === 'admin') {
          const adminEmail = document.getElementById('adminEmail').value.trim();
          const adminKey = document.getElementById('adminKey').value;
          if (!adminEmail || !adminKey) {
            setStatus('Enter admin email and access key.', true);
            return;
          }
          setIdentity({ loginMode: 'admin', adminEmail, adminKey });
        } else {
          const employeeCode = document.getElementById('employeeCode').value.trim();
          const pin = document.getElementById('pin').value;
          if (!employeeCode || !pin) {
            setStatus('Enter both employee code and PIN.', true);
            return;
          }
          setIdentity({ loginMode: 'employee', employeeCode, pin });
        }
        loadState();
      }

      function renderAdminPortal(state) {
        activeView = 'admin';
        adminState = state;
        document.body.classList.add('admin-mode');
        const user = state.portalUser || {};
        const dashboard = state.dashboard || {};
        const period = dashboard.currentPeriod || {};
        document.getElementById('app').innerHTML = `
          <div class="dashboard-shell">
            <header class="dashboard-head">
              <div>
                <p class="eyebrow">${escapeHtml(user.role || 'Dashboard')}</p>
                <h1>${escapeHtml(user.displayName || 'Admin Dashboard')}</h1>
              </div>
              <div class="dashboard-meta">
                <div>${escapeHtml(user.activeUserEmail || user.email || '')}</div>
                <div>${escapeHtml(period.label || '')}</div>
                <div>${escapeHtml(dashboard.generatedAt || '')}</div>
                <button type="button" class="dashboard-logout" onclick="signOut()">Sign out</button>
              </div>
            </header>
            ${renderAdminNav(user.role)}
            <div id="adminContent">${renderAdminView()}</div>
            <p id="status" class="status"></p>
          </div>
        `;
      }

      function renderAdminNav(role) {
        const tabs = [
          { key: 'overview', label: 'Overview', role: 'Attendance Admin' },
          { key: 'attendance', label: 'Attendance', role: 'Attendance Admin' },
          { key: 'requests', label: 'Requests', role: 'Attendance Admin' },
          { key: 'employees', label: 'Employees', role: 'Attendance Admin' },
          { key: 'payroll', label: 'Payroll', role: 'Payroll Admin' },
          { key: 'lifecycle', label: 'Lifecycle', role: 'Payroll Admin' },
          { key: 'data', label: 'Data', role: 'Attendance Admin' }
        ].filter(tab => adminHasRole(role, tab.role));
        if (!tabs.some(tab => tab.key === adminView)) adminView = 'overview';
        return `<nav class="dashboard-nav">${tabs.map(tab => (
          `<button type="button" class="${adminView === tab.key ? 'active' : ''}" onclick="setAdminView('${tab.key}')">${escapeHtml(tab.label)}</button>`
        )).join('')}</nav>`;
      }

      function setAdminView(view) {
        adminView = view;
        const content = document.getElementById('adminContent');
        if (content) content.innerHTML = renderAdminView();
        const shell = document.getElementById('app');
        if (shell && adminState) {
          const nav = shell.querySelector('.dashboard-nav');
          if (nav) nav.outerHTML = renderAdminNav((adminState.portalUser || {}).role);
        }
        if (view === 'data') renderDataView();
      }

      function renderAdminView() {
        const dashboard = (adminState && adminState.dashboard) || {};
        if (adminView === 'overview') return renderAdminOverview(dashboard);
        if (adminView === 'attendance') return renderAdminActionsView('Attendance', ['Manual Clock Entry', 'Edit Attendance Status', 'Rebuild Attendance Log', 'Refresh PTO Balances', 'Scorecards']);
        if (adminView === 'requests') return renderAdminRequestsView(dashboard);
        if (adminView === 'employees') return renderAdminActionsView('Employees', ['Add Employee']);
        if (adminView === 'payroll') return renderAdminPayrollView(dashboard);
        if (adminView === 'lifecycle') return renderAdminActionsView('Lifecycle', ['Compensation Change', 'Offboard Employee', 'Reactivate Employee']);
        if (adminView === 'data') return renderAdminDataShell(dashboard);
        return renderAdminOverview(dashboard);
      }

      function renderAdminOverview(dashboard) {
        const metrics = (dashboard.metrics || []).concat((dashboard.payroll && dashboard.payroll.metrics) || []);
        return `
          <section class="dashboard-section">
            <h2>Operations Overview</h2>
            ${renderDashboardMetrics(metrics)}
          </section>
          <section class="dashboard-section">
            <div class="admin-columns">
              ${renderQueueBlock('Time Off / Makeup', [].concat(dashboard.queues && dashboard.queues.timeOff || [], dashboard.queues && dashboard.queues.makeup || []))}
              ${renderQueueBlock('Timesheet Flags', dashboard.queues && dashboard.queues.timesheetFlags || [])}
            </div>
          </section>
        `;
      }

      function renderAdminRequestsView(dashboard) {
        return `
          <section class="dashboard-section">
            <h2>Request Queues</h2>
            <div class="admin-actions-grid">
              <button type="button" onclick="showAdminAction('timeOffRequest')">Submit Time Off</button>
              <button type="button" onclick="showAdminAction('makeupRequest')">Submit Makeup Hours</button>
              <button type="button" onclick="showAdminAction('pendingRequests')">Approve Time Off / Makeup</button>
              ${adminHasRole((adminState.portalUser || {}).role, 'Payroll Admin') ? `<button type="button" onclick="showAdminAction('timestampRevisions')">Approve Timestamp Revisions</button>` : ''}
            </div>
          </section>
          <section class="dashboard-section">
            <div class="admin-columns">
              ${renderQueueBlock('Pending Time Off', dashboard.queues && dashboard.queues.timeOff || [])}
              ${renderQueueBlock('Pending Makeup', dashboard.queues && dashboard.queues.makeup || [])}
              ${renderQueueBlock('Timestamp Revisions', dashboard.queues && dashboard.queues.timestampRevisions || [])}
              ${renderQueueBlock('Timesheet Flags', dashboard.queues && dashboard.queues.timesheetFlags || [])}
            </div>
          </section>
          <div id="adminActionHost"></div>
        `;
      }

      function renderAdminPayrollView(dashboard) {
        const payroll = dashboard.payroll || {};
        return `
          <section class="dashboard-section">
            <h2>Payroll Desk</h2>
            ${renderDashboardMetrics(payroll.metrics || [])}
            <div class="admin-actions-grid" style="margin-top: 20px;">
              <button type="button" onclick="showAdminAction('calculatePayPeriod')">Calculate Pay Period</button>
              <button type="button" onclick="showAdminAction('kpiDialog')">KPI Bonuses</button>
              <button type="button" onclick="showAdminAction('bonusAdjustment')">Bonus / Adjustment</button>
              <button type="button" onclick="runSimpleAdminAction('refreshQuarterlyPaTracker')">Refresh PA Tracker</button>
              <button type="button" onclick="showMarkPaidForm()">Mark Paid</button>
              <button type="button" onclick="runSimpleAdminAction('exportPayrollOutputCsv')">Export Payroll CSV</button>
            </div>
          </section>
          <section class="dashboard-section">
            <div class="admin-columns">
              ${renderQueueBlock('Recent Payroll Output', payroll.recentOutput || [])}
              ${renderQueueBlock('Recent Calculations', payroll.recentCalculations || [])}
            </div>
          </section>
          <div id="adminActionHost"></div>
        `;
      }

      function renderAdminActionsView(title, actionLabels) {
        const actions = ((adminState.dashboard || {}).actions || []).filter(action => actionLabels.indexOf(action.label) !== -1);
        return `
          <section class="dashboard-section">
            <h2>${escapeHtml(title)}</h2>
            <div class="admin-actions-grid">
              ${actions.map(action => `<button type="button" onclick="${adminActionOnclick(action.key)}">${escapeHtml(action.label)}</button>`).join('') || '<p class="empty">No actions available for this role.</p>'}
            </div>
          </section>
          <div id="adminActionHost"></div>
        `;
      }

      function renderAdminDataShell(dashboard) {
        const tabs = dashboard.dataTabs || [];
        return `
          <section class="dashboard-section">
            <h2>Source Data</h2>
            <p class="request-note">Sheets remain the source of record. Use these views for primary dashboard review; open the Sheet only as fallback.</p>
            <div class="data-selector-grid">
              ${tabs.map(tab => `<button type="button" onclick="loadPortalTable('${escapeAttr(tab.key)}')">${escapeHtml(tab.title)}</button>`).join('')}
            </div>
          </section>
          <section id="dataTableHost" class="dashboard-section"><p class="empty">Select a data view.</p></section>
        `;
      }

      function renderDashboardMetrics(metrics) {
        return `<div class="dashboard-grid">${(metrics || []).map(metric => `
          <div class="dashboard-tile">
            <div class="label">${escapeHtml(metric.label)}</div>
            <div class="value">${escapeHtml(metric.value)}</div>
          </div>
        `).join('')}</div>`;
      }

      function renderQueueBlock(title, rows) {
        const body = (rows || []).length
          ? rows.map(row => renderAdminListRow(row)).join('')
          : '<p class="empty">No current items.</p>';
        return `
          <div>
            <p class="admin-list-label">${escapeHtml(title)}</p>
            <div class="admin-list">${body}</div>
          </div>
        `;
      }

      function renderAdminListRow(row) {
        const primary = row.employee || row.employeeCode || row.periodId || row.requestId || row.date || 'Item';
        const secondary = [
          row.requestId,
          row.type || row.eventLabel || row.status,
          row.dateRange || row.workDate || row.date,
          row.hours !== undefined && row.hours !== '' ? `${row.hours}h` : '',
          row.notes || row.reason
        ].filter(Boolean).join(' | ');
        const right = row.lateMinutes ? `${row.lateMinutes}m late` : (row.workedHours !== undefined && row.workedHours !== '' ? `${row.workedHours}h` : '');
        return `
          <div class="admin-list-row">
            <div><strong>${escapeHtml(primary)}</strong><small>${escapeHtml(secondary)}</small></div>
            <div>${escapeHtml(right)}</div>
          </div>
        `;
      }

      function adminActionOnclick(key) {
        if (key === 'rebuildAttendanceLog') return 'showRebuildAttendanceForm()';
        if (key === 'refreshPtoBalances' || key === 'saveScorecard') return `runSimpleAdminAction('${key}')`;
        if (key === 'addEmployee') return "showAdminAction('addEmployeeDefaults')";
        return `showAdminAction('${key}')`;
      }

      function adminHasRole(actualRole, requiredRole) {
        const rank = { Employee: 1, 'Attendance Admin': 2, 'Payroll Admin': 3 };
        return (rank[actualRole] || 0) >= (rank[requiredRole] || 1);
      }

      function showAdminAction(action, payload) {
        const host = document.getElementById('adminActionHost') || document.getElementById('adminContent');
        if (host) host.innerHTML = '<div class="action-panel"><p class="loading">Loading action</p></div>';
        google.script.run
          .withSuccessHandler(data => renderAdminAction(action, data || {}))
          .withFailureHandler(showError)
          .getPortalActionData(action, payload || {}, getIdentity());
      }

      function renderAdminAction(action, data) {
        const host = document.getElementById('adminActionHost') || document.getElementById('adminContent');
        if (!host) return;
        if (action === 'manualClock') host.innerHTML = renderManualClockAction(data);
        else if (action === 'editAttendance') host.innerHTML = renderEditAttendanceAction(data);
        else if (action === 'timeOffRequest') host.innerHTML = renderAdminTimeOffRequestAction(data);
        else if (action === 'makeupRequest') host.innerHTML = renderAdminMakeupRequestAction(data);
        else if (action === 'pendingRequests') host.innerHTML = renderPendingRequestsAction(data);
        else if (action === 'timestampRevisions') host.innerHTML = renderTimestampRevisionsAction(data);
        else if (action === 'calculatePayPeriod') host.innerHTML = renderCalculatePayrollAction(data);
        else if (action === 'kpiDialog') host.innerHTML = renderKpiPeriodPicker(data);
        else if (action === 'kpiPeriod') host.innerHTML = renderKpiBonusAction(data);
        else if (action === 'bonusAdjustment') host.innerHTML = renderBonusAdjustmentAction(data);
        else if (action === 'compensationChange') host.innerHTML = renderCompensationChangeAction(data);
        else if (action === 'offboard') host.innerHTML = renderOffboardAction(data);
        else if (action === 'reactivate') host.innerHTML = renderReactivateAction(data);
        else if (action === 'addEmployeeDefaults') host.innerHTML = renderAddEmployeeAction(data);
        else if (action === 'scorecard') host.innerHTML = renderScorecardAction(data);
        else host.innerHTML = `<div class="action-panel"><p class="empty">No form configured for ${escapeHtml(action)}.</p></div>`;
        if (action === 'timeOffRequest') {
          toggleAdminTimeOffTimes();
          renderAdminTimeOffBalance();
          previewAdminTimeOff();
        }
        host.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function renderManualClockAction(data) {
        const employeeOptions = optionList(data.employees || [], 'employeeCode', 'displayName');
        const eventOptions = (data.eventTypes || []).map(item => `<option value="${escapeAttr(item.type)}">${escapeHtml(item.label)}</option>`).join('');
        return `
          <div class="action-panel">
            <h2>Manual Clock Entry</h2>
            <div class="admin-form-grid">
              <label>Employee<select id="adminEmployee">${employeeOptions}</select></label>
              <label>Event Type<select id="adminEventType">${eventOptions}</select></label>
              <label>Timestamp<input id="adminTimestamp" type="datetime-local" value="${escapeAttr(data.nowLocal || '')}"></label>
              <label>Notes<input id="adminNotes"></label>
            </div>
            ${adminActionButtons("runAdminAction('addManualClockEvent', collectManualClockPayload())")}
          </div>
        `;
      }

      function renderEditAttendanceAction(data) {
        return `
          <div class="action-panel">
            <h2>Edit Attendance Status</h2>
            <div class="admin-form-grid">
              <label>Employee<select id="adminEmployee">${optionList(data.employees || [], 'employeeCode', 'displayName')}</select></label>
              <label>Date<input id="adminDate" type="date" value="${escapeAttr(data.today || '')}"></label>
              <label>Status<select id="adminStatus">${(data.statuses || []).map(status => `<option>${escapeHtml(status)}</option>`).join('')}</select></label>
            </div>
            ${adminActionButtons("runAdminAction('editAttendanceLogEntry', { employeeCode: value('adminEmployee'), date: value('adminDate'), status: value('adminStatus') })")}
          </div>
        `;
      }

      function renderAdminTimeOffRequestAction(data) {
        adminTimeOffBalances = data.balances || {};
        return `
          <div class="action-panel">
            <h2>Submit Time Off</h2>
            <div class="admin-form-grid">
              <label>Employee<select id="adminTimeOffEmployee" onchange="renderAdminTimeOffBalance()">${optionList(data.employees || [], 'employeeCode', 'displayName')}</select></label>
              <label>Type<select id="adminTimeOffType" onchange="previewAdminTimeOff()">${(data.types || []).map(type => `<option value="${escapeAttr(type)}">${escapeHtml(type)}</option>`).join('')}</select></label>
              <label><input id="adminTimeOffFullDay" type="checkbox" checked onchange="toggleAdminTimeOffTimes(); previewAdminTimeOff()"> Full Day</label>
              <label>Start Date<input id="adminTimeOffStartDate" type="date" value="${escapeAttr(data.today || '')}" onchange="previewAdminTimeOff()"></label>
              <label>End Date<input id="adminTimeOffEndDate" type="date" value="${escapeAttr(data.today || '')}" onchange="previewAdminTimeOff()"></label>
              <label class="admin-timeoff-time-field">Start Time<input id="adminTimeOffStartTime" placeholder="10:00am" oninput="previewAdminTimeOff()"></label>
              <label class="admin-timeoff-time-field">End Time<input id="adminTimeOffEndTime" placeholder="02:00pm" oninput="previewAdminTimeOff()"></label>
            </div>
            <div class="metric-strip two">
              <div class="metric"><div class="label">Requested Hours</div><div id="adminTimeOffHours" class="value">Blank</div></div>
              <div class="metric"><div class="label">Balance</div><div id="adminTimeOffBalance" class="value">Blank</div></div>
            </div>
            <p id="adminTimeOffNote" class="request-note"></p>
            <label>Reason<textarea id="adminTimeOffReason"></textarea></label>
            ${adminActionButtons("runAdminAction('submitTimeOffRequest', collectAdminTimeOffRequestPayload())", 'Submit Request')}
          </div>
        `;
      }

      function renderAdminMakeupRequestAction(data) {
        return `
          <div class="action-panel">
            <h2>Submit Makeup Hours</h2>
            <p class="request-note">Approved makeup hours offset short-hour deductions in payroll. They do not override an absent day or an incomplete clock-out.</p>
            <div class="admin-form-grid">
              <label>Employee<select id="adminMakeupEmployee">${optionList(data.employees || [], 'employeeCode', 'displayName')}</select></label>
              <label>Date<input id="adminMakeupDate" type="date" value="${escapeAttr(data.today || '')}"></label>
              <label>Hours Requested<input id="adminMakeupHours" type="number" min="0.25" step="0.25"></label>
            </div>
            <label>Reason<textarea id="adminMakeupReason"></textarea></label>
            ${adminActionButtons("runAdminAction('submitMakeupHourRequest', collectAdminMakeupRequestPayload())", 'Submit Request')}
          </div>
        `;
      }

      function renderPendingRequestsAction(data) {
        const rows = []
          .concat((data.timeOffRequests || []).map(row => Object.assign({ kind: 'timeOff' }, row)))
          .concat((data.makeupRequests || []).map(row => Object.assign({ kind: 'makeup' }, row)));
        return `
          <div class="action-panel">
            <h2>Approve Time Off / Makeup</h2>
            ${rows.length ? rows.map(renderRequestDecisionRow).join('') : '<p class="empty">No pending requests.</p>'}
            ${rows.length ? adminActionButtons("runAdminAction('processPendingRequests', collectRequestDecisions())") : ''}
          </div>
        `;
      }

      function renderRequestDecisionRow(row) {
        const dateText = row.startDate || row.workDate || row.date || '';
        const endText = row.endDate && row.endDate !== dateText ? ` - ${row.endDate}` : '';
        const hourText = row.units !== undefined && row.units !== '' ? row.units : (row.hours || '');
        return `
          <div class="admin-list-row">
            <div>
              <strong>${escapeHtml(row.employee || row.employeeCode)} - ${escapeHtml(row.type || row.kind)}</strong>
              <small>${escapeHtml(row.requestId)} | ${escapeHtml(dateText)}${escapeHtml(endText)} | ${escapeHtml(hourText)}h | ${escapeHtml(row.reason || '')}</small>
            </div>
            <div>
              <select data-kind="${escapeAttr(row.kind)}" data-request-id="${escapeAttr(row.requestId)}" class="request-decision">
                <option>Keep</option><option>Approved</option><option>Denied</option>
              </select>
              <input data-request-id="${escapeAttr(row.requestId)}" class="request-notes" placeholder="Notes">
            </div>
          </div>
        `;
      }

      function renderTimestampRevisionsAction(data) {
        const rows = data.requests || [];
        return `
          <div class="action-panel">
            <h2>Timestamp Revisions</h2>
            ${rows.length ? rows.map(renderTimestampDecisionRow).join('') : '<p class="empty">No pending timestamp revisions.</p>'}
            ${rows.length ? adminActionButtons("runAdminAction('processTimestampRevisions', collectTimestampRevisionDecisions())") : ''}
          </div>
        `;
      }

      function renderTimestampDecisionRow(row) {
        return `
          <div class="admin-list-row">
            <div>
              <strong>${escapeHtml(row.employee)} - ${escapeHtml(row.eventLabel)}</strong>
              <small>${escapeHtml(row.requestId)} | ${escapeHtml(row.workDate)} | ${escapeHtml(row.originalTimestamp || 'missing')} -> ${escapeHtml(row.requestedTimestamp)} | ${escapeHtml(row.reason || '')}</small>
            </div>
            <div>
              <select data-request-id="${escapeAttr(row.requestId)}" class="timestamp-decision">
                <option>Keep</option><option>Approved</option><option>Denied</option>
              </select>
              <input data-request-id="${escapeAttr(row.requestId)}" class="timestamp-notes" placeholder="Notes">
            </div>
          </div>
        `;
      }

      function renderCalculatePayrollAction(data) {
        const periodOptions = (data.periods || []).map(period => `<option value="${escapeAttr(period.periodId)}" ${period.periodId === data.defaultPeriodId ? 'selected' : ''}>${escapeHtml(period.periodId)} - ${escapeHtml(period.status)}</option>`).join('');
        return `
          <div class="action-panel">
            <h2>Calculate Pay Period</h2>
            <label>Pay Period<select id="adminPeriod" onchange="loadPayrollEmployeesForPeriod()">${periodOptions}</select></label>
            <div id="payrollEmployeeList">${renderPayrollEmployeeCheckboxes(data.employees || [])}</div>
            ${adminActionButtons("runAdminAction('calculatePayPeriod', collectCalculatePayrollPayload())")}
          </div>
        `;
      }

      function renderPayrollEmployeeCheckboxes(employees) {
        return `
          <p class="request-note">Leave all unchecked to calculate everyone in the period.</p>
          <div class="admin-check-list">
            ${(employees || []).map(employee => `<label><input type="checkbox" class="payroll-employee" value="${escapeAttr(employee.employeeCode)}"> ${escapeHtml(employee.displayName)} (${escapeHtml(employee.employeeCode)})</label>`).join('') || '<p class="empty">No employees found for this period.</p>'}
          </div>
        `;
      }

      function loadPayrollEmployeesForPeriod() {
        const periodId = value('adminPeriod');
        const host = document.getElementById('payrollEmployeeList');
        if (host) host.innerHTML = '<p class="loading">Loading employees</p>';
        google.script.run
          .withSuccessHandler(employees => { if (host) host.innerHTML = renderPayrollEmployeeCheckboxes(employees || []); })
          .withFailureHandler(showError)
          .getPortalActionData('calculatePayPeriodEmployees', { periodId }, getIdentity());
      }

      function renderKpiPeriodPicker(data) {
        return `
          <div class="action-panel">
            <h2>KPI Bonuses</h2>
            <label>Pay Period<select id="kpiPeriod">${(data.periods || []).map(period => `<option value="${escapeAttr(period.periodId)}" ${period.periodId === data.defaultPeriodId ? 'selected' : ''}>${escapeHtml(period.periodId)} - ${escapeHtml(period.type)}</option>`).join('')}</select></label>
            ${adminActionButtons("showAdminAction('kpiPeriod', { periodId: value('kpiPeriod') })", 'Load KPI Entries')}
          </div>
        `;

      function renderScheduleEditor(prefix, schedule) {
        const normalized = normalizeScheduleForForm(schedule);
        return `
          <div class="admin-workflow-section">
            <h3>Work Schedule</h3>
            <p class="request-note">Set each normal working day. Lunch stays optional because employees clock lunch when they take it.</p>
            <table class="admin-schedule-table">
              <thead><tr><th>Day</th><th>Works</th><th>Start</th><th>End</th></tr></thead>
              <tbody>
                ${DAYS.map(day => `
                  <tr>
                    <td>${escapeHtml(day)}</td>
                    <td><input id="${prefix}${day}Enabled" type="checkbox" ${normalized[day].enabled ? 'checked' : ''}></td>
                    <td><input id="${prefix}${day}Start" value="${escapeAttr(normalized[day].start)}" placeholder="10:00am"></td>
                    <td><input id="${prefix}${day}End" value="${escapeAttr(normalized[day].end)}" placeholder="07:00pm"></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
            <div class="admin-form-grid">
              <label>Scheduled Lunch Start<input id="${prefix}LunchStart" value="${escapeAttr(normalized.lunchStart)}" placeholder="Optional"></label>
              <label>Scheduled Lunch End<input id="${prefix}LunchEnd" value="${escapeAttr(normalized.lunchEnd)}" placeholder="Optional"></label>
            </div>
          </div>
        `;
      }

      function normalizeScheduleForForm(schedule) {
        const source = schedule || {};
        const normalized = {
          lunchStart: source.lunchStart || '',
          lunchEnd: source.lunchEnd || ''
        };
        DAYS.forEach(day => {
          normalized[day] = {
            enabled: source[day] && source[day].enabled !== undefined
              ? Boolean(source[day].enabled)
              : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].indexOf(day) !== -1,
            start: source[day] && source[day].start ? source[day].start : '10:00am',
            end: source[day] && source[day].end ? source[day].end : '07:00pm'
          };
        });
        return normalized;
      }

      function renderCompField(prefix, field, rawValue) {
        const value = rawValue === undefined || rawValue === null ? '' : rawValue;
        const className = `${prefix}-comp-field comp-field`;
        if (field.type === 'select') {
          return `<label>${escapeHtml(field.label)}<select class="${className}" data-key="${escapeAttr(field.key)}">${(field.options || []).map(option => `<option value="${escapeAttr(option)}" ${String(option) === String(value) ? 'selected' : ''}>${escapeHtml(option)}</option>`).join('')}</select></label>`;
        }
        const inputType = field.type === 'number' ? 'number' : 'text';
        const step = field.type === 'number' ? ' step="0.01" min="0"' : '';
        return `<label>${escapeHtml(field.label)}<input class="${className}" data-key="${escapeAttr(field.key)}" type="${inputType}"${step} value="${escapeAttr(value)}"></label>`;
      }

      function loadPortalTable(tabKey) {
        if (tabKey && tabKey !== activeDataTab) {
          activeDataOffset = 0;
          activeDataQuery = '';
        }
        activeDataTab = tabKey || activeDataTab;
        const host = document.getElementById('dataTableHost');
        if (host) host.innerHTML = '<p class="loading">Loading data</p>';
        google.script.run
          .withSuccessHandler(renderPortalTable)
          .withFailureHandler(showError)
          .getPortalTableData(activeDataTab, {
            limit: activeDataLimit,
            offset: activeDataOffset,
            query: activeDataQuery

      }

      function renderDataView() {
        if (activeDataTab) loadPortalTable(activeDataTab);
      }

      function submitDataSearch() {
        activeDataQuery = value('dataQuery');
        activeDataOffset = 0;
        activeDataLimit = Number(value('dataLimit')) || activeDataLimit;
        loadPortalTable(activeDataTab);
      }

      function pagePortalTable(direction) {
        activeDataOffset = Math.max(0, activeDataOffset + (direction * activeDataLimit));
        loadPortalTable(activeDataTab);
      }

      function renderPortalTable(data) {
        const host = document.getElementById('dataTableHost');
        if (!host) return;
        const headers = data.headers || [];
        const rows = data.rows || [];
        activeDataOffset = data.offset || 0;
        activeDataLimit = data.limit || activeDataLimit;
        activeDataQuery = data.query || activeDataQuery || '';
        const startRow = rows.length ? activeDataOffset + 1 : 0;
        const endRow = activeDataOffset + rows.length;
        host.innerHTML = `
          <h2>${escapeHtml(data.title || 'Data')}</h2>
          <p class="request-note">${escapeHtml(startRow)}-${escapeHtml(endRow)} of ${escapeHtml(data.totalRows)} row(s). Source: ${escapeHtml(data.source)}</p>
          <div class="data-controls">
            <label>Search<input id="dataQuery" value="${escapeAttr(activeDataQuery)}" onkeydown="if(event.key === 'Enter') submitDataSearch()"></label>
            <label>Rows<select id="dataLimit" onchange="activeDataLimit = Number(this.value); activeDataOffset = 0; loadPortalTable(activeDataTab)">
              ${[50, 100, 250].map(limit => `<option value="${limit}" ${Number(activeDataLimit) === limit ? 'selected' : ''}>${limit}</option>`).join('')}
            </select></label>
            <button type="button" class="secondary compact" onclick="submitDataSearch()">Apply</button>
            <button type="button" class="secondary compact" onclick="activeDataQuery=''; activeDataOffset=0; loadPortalTable(activeDataTab)">Clear</button>
          </div>
          <div class="data-table-wrap">
            <table class="data-table">
              <thead><tr>${headers.map(header => `<th>${escapeHtml(header)}</th>`).join('')}</tr></thead>
              <tbody>${rows.map(row => `<tr>${headers.map((_, index) => `<td>${escapeHtml(row[index])}</td>`).join('')}</tr>`).join('')}</tbody>
            </table>
          </div>
          <div class="form-actions">
            <button type="button" class="secondary" ${data.hasPrevious ? '' : 'disabled'} onclick="pagePortalTable(-1)">Previous</button>
            <button type="button" class="secondary" ${data.hasNext ? '' : 'disabled'} onclick="pagePortalTable(1)">Next</button>
          </div>
        `;
      }

      function optionList(rows, valueKey, labelKey) {
        return (rows || []).map(row => `<option value="${escapeAttr(row[valueKey])}">${escapeHtml(row[labelKey] || row[valueKey])}</option>`).join('');
      }

      function collectRequestDecisions() {
        const decisions = [];
        document.querySelectorAll('.request-decision').forEach(select => {
          const requestId = select.getAttribute('data-request-id');

          decisions.push({
            kind: select.getAttribute('data-kind'),
            requestId,
            decision: select.value,
            notes: notesNode ? notesNode.value.trim() : ''

        return { decisions };
