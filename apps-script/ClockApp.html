<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --panel: #ffffff;
        --ink: #172033;
        --muted: #5f6b7a;
        --line: #d8dee8;
        --primary: #1f6feb;
        --primary-dark: #1959bd;
        --disabled: #e5e9f0;
        --disabled-ink: #7b8492;
        --danger: #b42318;
        --ok: #0f7b3f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.45 Arial, sans-serif;
      }
      main {
        width: min(460px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 18px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 22px;
        box-shadow: 0 10px 28px rgba(31, 50, 81, 0.08);
      }
      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0;
      }
      .date, .muted {
        color: var(--muted);
      }
      .time {
        margin-top: 2px;
        font-size: 32px;
        font-weight: 700;
      }
      .state {
        margin: 18px 0;
        padding: 10px 12px;
        border: 1px solid #b8ddc6;
        border-radius: 6px;
        color: var(--ok);
        background: #f1fbf5;
        font-weight: 700;
      }
      .buttons {
        display: grid;
        gap: 10px;
        margin: 18px 0;
      }
      button {
        width: 100%;
        min-height: 50px;
        border: 0;
        border-radius: 6px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: var(--primary-dark); }
      button:disabled {
        cursor: not-allowed;
        background: var(--disabled);
        color: var(--disabled-ink);
      }
      .secondary {
        background: transparent;
        color: var(--primary);
        border: 1px solid var(--line);
        min-height: 42px;
      }
      .secondary:hover:not(:disabled) {
        background: #eef5ff;
        color: var(--primary-dark);
      }
      .summary {
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
      }
      .summary li {
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      label {
        display: block;
        margin: 14px 0 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
      }
      input {
        width: 100%;
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 12px;
        font: inherit;
      }
      .status {
        min-height: 22px;
        margin-top: 12px;
        color: var(--muted);
      }
      .error { color: var(--danger); }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <div id="app">
          <p class="muted">Loading clock state...</p>
        </div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = 'payrollClockIdentity';
      let latestState = null;

      function getIdentity() {
        try {
          return JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '{}');
        } catch (error) {
          return {};
        }
      }

      function setIdentity(identity) {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(identity || {}));
      }

      function clearIdentity() {
        sessionStorage.removeItem(STORAGE_KEY);
      }

      function loadState() {
        setStatus('Loading clock state...');
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(showError)
          .getClockAppInitialState(getIdentity());
      }

      function render(state) {
        latestState = state;
        if (!state.authenticated) {
          renderIdentityForm(state);
          return;
        }

        const buttons = state.buttons.map(button => (
          `<button type="button" ${button.enabled ? '' : 'disabled'} onclick="submitEvent('${button.type}')">${escapeHtml(button.label)}</button>`
        )).join('');
        const summary = state.todaySummary.map(item => `<li>${escapeHtml(item)}</li>`).join('');

        document.getElementById('app').innerHTML = `
          <h1>Hi, ${escapeHtml(state.employee.displayName)}</h1>
          <div class="date">${escapeHtml(state.dateLabel)}</div>
          <div class="time">${escapeHtml(state.timeLabel)}</div>
          <div class="state">${escapeHtml(state.currentState)}</div>
          <div class="buttons">${buttons}</div>
          <h2 class="muted" style="font-size:16px;margin:22px 0 8px;">Today so far</h2>
          <ul class="summary">${summary}</ul>
          <p id="status" class="status"></p>
          <button type="button" class="secondary" onclick="signOut()">Sign out</button>
        `;
      }

      function renderIdentityForm(state) {
        document.getElementById('app').innerHTML = `
          <h1>Employee Clock-In</h1>
          <p class="muted">${escapeHtml(state.message || 'Enter your employee code and PIN.')}</p>
          <label for="employeeCode">Employee Code</label>
          <input id="employeeCode" autocomplete="username" inputmode="text">
          <label for="pin">Web App PIN</label>
          <input id="pin" type="password" autocomplete="current-password" inputmode="numeric">
          <div class="buttons">
            <button type="button" onclick="saveIdentity()">Continue</button>
          </div>
          <p id="status" class="status"></p>
        `;
      }

      function saveIdentity() {
        const employeeCode = document.getElementById('employeeCode').value.trim();
        const pin = document.getElementById('pin').value;
        if (!employeeCode || !pin) {
          setStatus('Enter both employee code and PIN.', true);
          return;
        }
        setIdentity({ employeeCode, pin });
        loadState();
      }

      function submitEvent(eventType) {
        disableButtons(true);
        setStatus('Saving...');
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(error => {
            showError(error);
            disableButtons(false);
          })
          .recordClockEvent({
            eventType,
            identity: getIdentity(),
            device: navigator.userAgent || ''
          });
      }

      function signOut() {
        clearIdentity();
        latestState = null;
        loadState();
      }

      function disableButtons(disabled) {
        document.querySelectorAll('button').forEach(button => {
          if (!button.classList.contains('secondary')) button.disabled = disabled;
        });
      }

      function setStatus(message, isError) {
        const node = document.getElementById('status') || document.getElementById('app');
        if (!node) return;
        node.textContent = message || '';
        node.className = isError ? 'status error' : 'status';
      }

      function showError(error) {
        setStatus(error && error.message ? error.message : String(error), true);
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      loadState();
      setInterval(loadState, 60000);
    </script>
  </body>
</html>
