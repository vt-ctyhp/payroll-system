          rows: Array.from(document.querySelectorAll('.kpi-row')).map(row => ({
            employeeCode: row.getAttribute('data-employee'),
            approvedPercent: (row.querySelector('.kpi-percent') || {}).value || '',
            notes: (row.querySelector('.kpi-notes') || {}).value || ''
          }))
        };
      }

      function collectBonusPayload() {
        const mode = value('bonusMode');
        return {
          entryMode: mode,
          periodId: value('bonusPeriod'),
          employeeCode: value('bonusEmployee'),
          adjustmentType: mode === 'additional' ? 'Additional' : value('bonusType'),
          amount: value('bonusAmount'),
          description: value('bonusDescription')
        };
      }

      function collectCompChangePayload() {
        return {
          employeeCode: value('compEmployee'),
          effectiveFrom: value('compEffectiveFrom'),
          reason: value('compReason'),
          retroactive: value('compRetroactive') === 'true',
          retroStart: value('compRetroStart'),
          retroEnd: value('compRetroEnd'),
          adjustmentPeriodId: value('compAdjustmentPeriod'),
          newComp: collectCompPayload('compChange'),
          notes: value('compNotes')
        };
      }

      function collectOffboardPayload() {
        return {
          employeeCode: value('offboardEmployee'),
          eventType: value('offboardEvent'),
          lastWorkingDay: value('offboardLastDay'),
          reason: value('offboardReason'),
          notes: value('offboardNotes')
        };
      }

      function collectReactivatePayload() {
        return {
          employeeCode: value('reactivateEmployee'),
          startDate: value('reactivateStartDate'),
          reason: value('reactivateReason'),
          position: value('reactivatePosition'),
          manager: value('reactivateManager'),
          schedule: collectSchedulePayload('reactivateSchedule'),
          comp: collectCompPayload('reactivate'),
          notes: value('reactivateNotes')
        };
      }

      function collectAddEmployeePayload() {
        const isPayrollAdmin = adminHasRole((adminState.portalUser || {}).role, 'Payroll Admin');
        return {
          includeComp: isPayrollAdmin,
          fullName: value('newFullName'),
          displayName: value('newDisplayName'),
          employeeCode: value('newEmployeeCode'),
          email: value('newEmail'),
          department: value('newDepartment'),
          portalRole: value('newPortalRole'),
          startDate: value('newStartDate'),
          pin: value('newPin'),
          position: value('newPosition'),
          manager: value('newManager'),
          schedule: collectSchedulePayload('newSchedule'),
          comp: isPayrollAdmin ? collectCompPayload('new') : {},
          notes: value('newNotes')
        };
      }

      function collectSchedulePayload(prefix) {
        const schedule = {
          lunchStart: value(`${prefix}LunchStart`),
          lunchEnd: value(`${prefix}LunchEnd`)
        };
        DAYS.forEach(day => {
          schedule[day] = {
            enabled: Boolean(document.getElementById(`${prefix}${day}Enabled`) && document.getElementById(`${prefix}${day}Enabled`).checked),
            start: value(`${prefix}${day}Start`),
            end: value(`${prefix}${day}End`)
          };
        });
        return schedule;
      }

      function collectCompPayload(prefix) {
        const comp = {};
        document.querySelectorAll(`.${prefix}-comp-field`).forEach(node => {
          comp[node.getAttribute('data-key')] = node.value.trim();
        });
        return comp;
      }

      function cssEscape(value) {
        if (window.CSS && CSS.escape) return CSS.escape(value);
        return String(value || '').replace(/["\\]/g, '\\$&');
      }

      function submitEvent(eventType) {
        disableButtons(true);
        setStatus('Saving...');
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(error => {
            showError(error);
            disableButtons(false);
          })
          .recordClockEvent({
            eventType,
            identity: getIdentity(),
            device: navigator.userAgent || ''
          });
      }

      function showTimeOffForm() {
        if (!latestState || !latestState.authenticated) return;
        activeView = 'timeOff';
        const today = getLocalDateInputValue();
        const typeOptions = (latestState.timeOffTypes || ['PTO', 'UTO', 'Non-PTO'])
          .map(type => `<option value="${escapeAttr(type)}">${escapeHtml(type)}</option>`)
          .join('');
        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Employee Request</p>
          <h1>Time Off</h1>
          <p class="request-note">Requests stay pending until a manager approves them.</p>
          ${renderBalanceLine(latestState.ptoBalance)}
          <label for="requestType">Type</label>
          <select id="requestType">${typeOptions}</select>
          <label for="startDate">Start Date</label>
          <input id="startDate" type="date" value="${escapeAttr(today)}">
          <label for="endDate">End Date</label>
          <input id="endDate" type="date" value="${escapeAttr(today)}">
          <label class="checkbox-line"><input id="fullDay" type="checkbox" checked onchange="toggleTimeOffTimeFields(); scheduleTimeOffPreview()"> Full Day</label>
          <label for="startTime">Start Time</label>
          <input id="startTime" placeholder="10:00am" oninput="scheduleTimeOffPreview()">
          <label for="endTime">End Time</label>
          <input id="endTime" placeholder="02:00pm" oninput="scheduleTimeOffPreview()">
          <div class="metric-strip two">
            <div class="metric"><div class="label">Requested Hours</div><div id="requestedHoursPreview" class="value">Blank</div></div>
            <div class="metric"><div class="label">Calculation</div><div id="calculationNote" class="value">Blank</div></div>
          </div>
          <label for="reason">Reason</label>
          <textarea id="reason"></textarea>
          <div class="form-actions">
            <button type="button" class="secondary" onclick="backToClock()">Cancel</button>
            <button id="submitRequestButton" type="button" onclick="submitTimeOffRequest()">Submit</button>
          </div>
          <p id="status" class="status"></p>
        `;
        ['requestType', 'startDate', 'endDate'].forEach(id => {
          const node = document.getElementById(id);
          if (node) node.addEventListener('change', scheduleTimeOffPreview);
        });
        toggleTimeOffTimeFields();
        scheduleTimeOffPreview();
      }

      function showMakeupForm() {
        if (!latestState || !latestState.authenticated) return;
        activeView = 'makeup';
        const today = getLocalDateInputValue();
        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Employee Request</p>
          <h1>Makeup Hours</h1>
          <p class="request-note">Approved makeup hours offset short-hour deductions in payroll.</p>
          <label for="makeupDate">Date</label>
          <input id="makeupDate" type="date" value="${escapeAttr(today)}">
          <label for="makeupHours">Hours Requested</label>
          <input id="makeupHours" type="number" min="0.25" step="0.25" inputmode="decimal">
          <label for="makeupReason">Reason</label>
          <textarea id="makeupReason"></textarea>
          <div class="form-actions">
            <button type="button" class="secondary" onclick="backToClock()">Cancel</button>
            <button id="submitRequestButton" type="button" onclick="submitMakeupRequest()">Submit</button>
          </div>
          <p id="status" class="status"></p>
        `;
      }

      function showTimesheetReview(viewMode) {
        if (!latestState || !latestState.authenticated) return;
        activeView = 'timesheet';
        latestReviewMode = viewMode === 'recent' ? 'recent' : 'currentPeriod';
        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Timesheet Review</p>
          <h1>Review Timesheet</h1>
          <p class="loading">Loading timesheet</p>
          <p id="status" class="status"></p>
        `;
        google.script.run
          .withSuccessHandler(renderTimesheetReview)
          .withFailureHandler(showError)
          .getEmployeeTimesheetReview(getIdentity(), latestReviewMode);
      }

      function renderTimesheetReview(data) {
        activeView = 'timesheet';
        latestReview = data;
        latestReviewMode = data.viewMode || latestReviewMode;
        const rows = (data.rows || []).map((row, index) => renderTimesheetRow(row, index)).join('');
        const counts = data.counts || { openIssues: 0, pendingRevisions: 0, total: 0 };
        const currentActive = latestReviewMode === 'currentPeriod' ? 'active' : '';
        const recentActive = latestReviewMode === 'recent' ? 'active' : '';
        document.getElementById('app').innerHTML = `
          <p class="eyebrow">Timesheet Review</p>
          <h1>${escapeHtml(data.employee ? data.employee.displayName : 'Review Timesheet')}</h1>
          <p class="request-note">${escapeHtml((data.selectedWindow && data.selectedWindow.label) || '')}</p>
          <div class="metric-strip">
            <div class="metric"><div class="label">Open Issues</div><div class="value">${escapeHtml(counts.openIssues || 0)}</div></div>
            <div class="metric"><div class="label">Pending Revisions</div><div class="value">${escapeHtml(counts.pendingRevisions || 0)}</div></div>
            <div class="metric"><div class="label">Total Flags</div><div class="value">${escapeHtml(counts.total || 0)}</div></div>
          </div>
          <div class="segmented">
            <button type="button" class="${currentActive}" onclick="showTimesheetReview('currentPeriod')">Current Period</button>
            <button type="button" class="${recentActive}" onclick="showTimesheetReview('recent')">Recent</button>
          </div>
          <div class="timesheet-list">${rows || '<p class="empty">No timesheet rows in this window.</p>'}</div>
          <div id="revisionFormHost"></div>
          <p id="status" class="status"></p>
          <button type="button" class="secondary" onclick="backToClock()">Back to Clock</button>
        `;
      }

      function renderTimesheetRow(row, index) {
        const issues = row.issues || [];
        const chips = issues.length
          ? issues.map(issue => `<span class="chip ${issue.isRevision ? '' : 'issue'}">${escapeHtml(issue.label)}</span>`).join('')
          : '<span class="chip">No flags</span>';
        const revision = row.revisionStatus ? `<span class="chip">${escapeHtml(row.revisionStatus)}</span>` : '';
        return `
          <article class="timesheet-row">
            <div class="timesheet-head">
              <div>
                <p class="timesheet-date">${escapeHtml(row.dateLabel || row.date)}</p>
                <p class="request-note">${escapeHtml(row.schedule || '')}</p>
              </div>
              <div class="timesheet-status">${escapeHtml(row.status || 'No status')}</div>
            </div>
            <div class="timestamp-grid">
              ${renderTimestampCell('Clock In', row.clockIn)}
              ${renderTimestampCell('Lunch Start', row.lunchStart)}
              ${renderTimestampCell('Lunch End', row.lunchEnd)}
              ${renderTimestampCell('Clock Out', row.clockOut)}
              ${renderTimestampCell('Worked', row.workedHours === '' ? '' : `${row.workedHours}h`)}
              ${renderTimestampCell('Late', row.lateMinutes === '' ? '' : `${row.lateMinutes}m`)}
              ${renderTimestampCell('Break 1', [row.break1Start, row.break1End].filter(Boolean).join(' - '))}
              ${renderTimestampCell('Break 2', [row.break2Start, row.break2End].filter(Boolean).join(' - '))}
            </div>
            <div class="chips">${chips}${revision}</div>
            <div class="row-actions">
              <button type="button" class="secondary compact" onclick="showRevisionForm(${index})">Request Revision</button>
            </div>
          </article>
        `;
      }

      function renderTimestampCell(label, value) {
        return `
          <div class="timestamp">
            <div class="label">${escapeHtml(label)}</div>
            <div class="value">${escapeHtml(value || 'blank')}</div>
          </div>
        `;
      }

      function showRevisionForm(rowIndex) {
        if (!latestReview || !latestReview.rows || !latestReview.rows[rowIndex]) return;
        const row = latestReview.rows[rowIndex];
        const selectedType = row.suggestedEventType || 'CLOCK_IN';
        const typeOptions = (latestReview.eventTypes || [])
          .map(item => `<option value="${escapeAttr(item.type)}" ${item.type === selectedType ? 'selected' : ''}>${escapeHtml(item.label)}</option>`)
          .join('');
        const eventOptions = renderOriginalEventOptions(row.events || []);
        document.getElementById('revisionFormHost').innerHTML = `
          <div class="revision-form">
            <p class="eyebrow">Timestamp Revision</p>
            <h1>${escapeHtml(row.dateLabel || row.date)}</h1>
            <input id="revisionDate" type="hidden" value="${escapeAttr(row.date)}">
            <label for="revisionType">Event Type</label>
            <select id="revisionType">${typeOptions}</select>
            <label for="originalEventId">Original Event</label>
            <select id="originalEventId">${eventOptions}</select>
            <label for="requestedTime">Requested Timestamp</label>
            <input id="requestedTime" placeholder="09:00am" inputmode="text">
            <label for="revisionReason">Reason</label>
            <textarea id="revisionReason"></textarea>
            <div class="form-actions">
              <button type="button" class="secondary" onclick="clearRevisionForm()">Cancel</button>
              <button id="submitRequestButton" type="button" onclick="submitTimestampRevisionRequest()">Submit</button>
            </div>
          </div>
        `;
        document.getElementById('revisionFormHost').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function renderOriginalEventOptions(events) {
        const rows = ['<option value="">Missing timestamp / no original event</option>'];
        events.forEach(event => {
          const label = `${event.eventLabel || event.eventType} ${event.timeLabel || event.timestamp}`;
          rows.push(`<option value="${escapeAttr(event.eventId)}">${escapeHtml(label)}</option>`);
        });
        return rows.join('');
      }

      function clearRevisionForm() {
        const host = document.getElementById('revisionFormHost');
        if (host) host.innerHTML = '';
      }

      function submitTimestampRevisionRequest() {
        const payload = {
          identity: getIdentity(),
          workDate: value('revisionDate'),
          eventType: value('revisionType'),
          originalEventId: value('originalEventId'),
          requestedTime: value('requestedTime'),
          reason: value('revisionReason')
        };
        if (!payload.workDate || !payload.eventType || !payload.requestedTime || !payload.reason) {
          setStatus('Complete every revision field before submitting.', true);
          return;
        }
        setRequestBusy(true);
        setStatus('Submitting revision...');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Revision submitted.');
            setRequestBusy(false);
            showTimesheetReview(latestReviewMode);
          })
          .withFailureHandler(error => {
            showError(error);
            setRequestBusy(false);
          })
          .submitTimestampRevisionRequest(payload);
      }

      function submitTimeOffRequest() {
        const payload = {
          identity: getIdentity(),
          type: value('requestType'),
          startDate: value('startDate'),
          endDate: value('endDate'),
          startTime: value('startTime'),
          endTime: value('endTime'),
          fullDay: document.getElementById('fullDay').checked ? 'Yes' : 'No',
          reason: value('reason')
        };
        if (!payload.startDate || !payload.endDate || !payload.reason || (payload.fullDay !== 'Yes' && (!payload.startTime || !payload.endTime))) {
          setStatus('Complete every field before submitting.', true);
          return;
        }
        setRequestBusy(true);
        setStatus('Submitting request...');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Request submitted.');
            setRequestBusy(false);
          })
          .withFailureHandler(error => {
            showError(error);
            setRequestBusy(false);
          })
          .submitWebTimeOffRequest(payload);
      }

      function toggleTimeOffTimeFields() {
        const fullDay = document.getElementById('fullDay');
        const start = document.getElementById('startTime');
        const end = document.getElementById('endTime');
        if (!fullDay || !start || !end) return;
        start.disabled = fullDay.checked;
        end.disabled = fullDay.checked;
      }

      let timeOffPreviewTimer = null;
      function scheduleTimeOffPreview() {
        clearTimeout(timeOffPreviewTimer);
        timeOffPreviewTimer = setTimeout(updateTimeOffPreview, 250);
      }

      function updateTimeOffPreview() {
        const fullDay = document.getElementById('fullDay');
        const hoursNode = document.getElementById('requestedHoursPreview');
        const noteNode = document.getElementById('calculationNote');
        if (!fullDay || !hoursNode || !noteNode || !value('startDate') || !value('endDate')) return;
        if (!fullDay.checked && (!value('startTime') || !value('endTime'))) {
          hoursNode.textContent = 'Blank';
          noteNode.textContent = 'Enter start and end time.';
          return;
        }
        google.script.run
          .withSuccessHandler(result => {
            hoursNode.textContent = formatBalance(result.requestedHours);
            noteNode.textContent = result.note || 'Ready.';
          })
          .withFailureHandler(error => {
            hoursNode.textContent = 'Blank';
            noteNode.textContent = error && error.message ? error.message : String(error);
          })
          .previewWebTimeOffRequest({
            identity: getIdentity(),
            type: value('requestType'),
            startDate: value('startDate'),
            endDate: value('endDate'),
            startTime: value('startTime'),
            endTime: value('endTime'),
            fullDay: fullDay.checked ? 'Yes' : 'No'
          });
      }

      function submitMakeupRequest() {
        const payload = {
          identity: getIdentity(),
          date: value('makeupDate'),
          hoursRequested: value('makeupHours'),
          reason: value('makeupReason')
        };
        if (!payload.date || !payload.hoursRequested || !payload.reason) {
          setStatus('Complete every field before submitting.', true);
          return;
        }
        setRequestBusy(true);
        setStatus('Submitting request...');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Request submitted.');
            setRequestBusy(false);
          })
          .withFailureHandler(error => {
            showError(error);
            setRequestBusy(false);
          })
          .submitWebMakeupHourRequest(payload);
      }

      function backToClock() {
        activeView = 'clock';
        loadState();
      }

      function signOut() {
        activeView = 'clock';
        loginMode = 'employee';
        adminState = null;
        clearIdentity();
        latestState = null;
        loadState();
      }

      function disableButtons(disabled) {
        document.querySelectorAll('button').forEach(button => {
          if (!button.classList.contains('secondary')) button.disabled = disabled;
        });
      }

      function setRequestBusy(disabled) {
        const button = document.getElementById('submitRequestButton');
        if (button) button.disabled = disabled;
      }

      function value(id) {
        const node = document.getElementById(id);
        return node ? node.value.trim() : '';
      }

      function renderBalanceLine(balance) {
        if (!balance) return '';
        if (balance.unavailable) {
          return `<p class="balance-line">${escapeHtml(balance.message || 'PTO balance unavailable.')}</p>`;
        }
        const plan = balance.ptoPlanType || 'PTO';
        const earned = formatBalance(balance.earnedPto);
        const pto = formatBalance(balance.remainingPto);
        const nonPto = formatBalance(balance.remainingNonPto);
        return `<p class="balance-line">Current year balance: ${escapeHtml(plan)} PTO earned ${escapeHtml(earned)}h, remaining ${escapeHtml(pto)}h | Non-PTO ${escapeHtml(nonPto)}h</p>`;
      }

      function renderTimesheetDashboardNotice(summary) {
        if (!summary) return '';
        if (summary.unavailable) {
          return `<p class="balance-line">${escapeHtml(summary.message || 'Timesheet review unavailable.')}</p>`;
        }
        const total = Number(summary.total || 0);
        if (!total) {
          return '<p class="balance-line">Timesheet review: no open flags or pending revisions.</p>';
        }
        const recentTotal = Number(summary.recentWorkingTotal || 0);
        const recentDays = Number(summary.recentWorkingDaysChecked || 0);
        const flaggedDays = (summary.recentFlaggedDays || []).join(', ');
        const detail = recentTotal
          ? `${recentTotal} flag(s) are from the last ${recentDays || 2} working day(s)${flaggedDays ? `: ${flaggedDays}` : ''}.`
          : 'No flags are on the last two working days, but older current/recent items still need attention.';
        const view = summary.recommendedView === 'currentPeriod' ? 'currentPeriod' : 'recent';
        return `
          <section class="timesheet-alert">
            <p class="timesheet-alert-label">Timesheet Needs Review</p>
            <h2 class="timesheet-alert-title">${escapeHtml(total)} open flag(s)</h2>
            <p class="timesheet-alert-copy">${escapeHtml(detail)} Overall: ${escapeHtml(summary.openIssues || 0)} issue(s), ${escapeHtml(summary.pendingRevisions || 0)} pending revision(s).</p>
            <button type="button" onclick="showTimesheetReview('${view}')">Review Timesheet</button>
          </section>
        `;
      }

      function pickStatusPhrase(state) {
        const eventType = state.lastEventType || 'CLOCK_IN';
        const phrases = STATUS_PHRASES[eventType] || [];
        if (!phrases.length) return '';
        const key = [
          state.employee && state.employee.employeeCode,
          state.dateLabel,
          eventType,
          (state.todaySummary || []).join('|')
        ].join('::');
        try {
          const cached = JSON.parse(sessionStorage.getItem(PHRASE_STORAGE_KEY) || '{}');
          if (cached.key === key && cached.phrase) return cached.phrase;
          const phrase = phrases[Math.floor(Math.random() * phrases.length)];
          sessionStorage.setItem(PHRASE_STORAGE_KEY, JSON.stringify({ key, phrase }));
          return phrase;
        } catch (error) {
          return phrases[Math.floor(Math.random() * phrases.length)];
        }
      }

      function formatBalance(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number.toFixed(2) : 'blank';
      }

      function getLocalDateInputValue() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        return now.toISOString().slice(0, 10);
      }

      function setStatus(message, isError) {
        const node = document.getElementById('status') || document.getElementById('app');
        if (!node) return;
        node.textContent = message || '';
        node.className = isError ? 'status error' : 'status';
      }

      function showError(error) {
        setStatus(error && error.message ? error.message : String(error), true);
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#096;');
      }

      loadState();
      setInterval(loadState, 60000);
    </script>
  </body>
</html>
