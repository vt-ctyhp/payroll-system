<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg-foundation: #F7F1EB;
        --surface-card: #FBF7F1;
        --surface-inset: #EFE8DD;
        --ink-primary: #2A2725;
        --ink-body: #4A4540;
        --ink-muted: #8A8178;
        --rule: #D4CFC4;
        --accent: #E91D79;
        --serif: 'Cormorant Garamond', Georgia, serif;
        --sans: 'Inter', system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-foundation);
        color: var(--ink-body);
        font: 14px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      form { padding: 28px 28px 0; }
      h2 {
        margin: 0;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 400;
        line-height: 1.15;
      }
      .eyebrow,
      label,
      button,
      th,
      .hint {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .eyebrow,
      label,
      th,
      .hint { color: var(--ink-muted); }
      .section-head {
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--rule);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 24px;
      }
      .full { grid-column: 1 / -1; }
      label { display: block; margin-bottom: 6px; }
      select,
      input,
      textarea {
        width: 100%;
        min-height: 38px;
        border: 0;
        border-bottom: 1px solid var(--rule);
        border-radius: 0;
        padding: 6px 2px;
        background: transparent;
        color: var(--ink-primary);
        font: inherit;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        appearance: none;
        -webkit-appearance: none;
      }
      select:focus,
      input:focus,
      textarea:focus {
        outline: none;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 5px;
      }
      textarea { min-height: 82px; resize: vertical; }
      input[type="checkbox"] {
        width: 16px;
        min-height: auto;
        height: 16px;
        accent-color: var(--accent);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0 22px;
      }
      th,
      td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--rule);
        text-align: left;
        vertical-align: top;
      }
      th {
        border-top: 1px solid var(--rule);
        background: var(--surface-inset);
      }
      td { font-variant-numeric: tabular-nums; }
      .inset {
        margin: 24px 0;
        padding: 18px;
        background: var(--surface-inset);
        border: 1px solid var(--rule);
      }
      .retro-grid { display: none; margin-top: 18px; }
      .status {
        min-height: 22px;
        margin: 18px 0 0;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .error { color: var(--accent); }
      .actions {
        position: sticky;
        bottom: 0;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin: 28px -28px 0;
        padding: 18px 28px;
        border-top: 2px solid var(--accent);
        background: var(--bg-foundation);
      }
      button {
        min-height: 42px;
        padding: 0 22px;
        border: 1px solid var(--ink-primary);
        border-radius: 0;
        background: transparent;
        color: var(--ink-primary);
        font-family: var(--sans);
        cursor: pointer;
      }
      button:hover:not(:disabled),
      button.primary {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <form onsubmit="submitForm(event)">
      <div class="section-head">
        <p class="eyebrow">Payroll Governance</p>
        <h2>Compensation Change</h2>
      </div>

      <div class="grid">
        <div class="full">
          <label for="employeeCode">Employee</label>
          <select id="employeeCode" onchange="loadEmployee()" required></select>
        </div>
        <div>
          <label for="effectiveFrom">Effective From</label>
          <input id="effectiveFrom" type="date" required>
        </div>
        <div>
          <label for="reason">Reason</label>
          <input id="reason" required>
        </div>
      </div>

      <div class="inset">
        <p class="hint">Current Compensation</p>
        <table>
          <thead><tr><th>Field</th><th>Current</th><th>New Value</th></tr></thead>
          <tbody id="compRows"><tr><td colspan="3">Loading...</td></tr></tbody>
        </table>
      </div>

      <div class="inset">
        <label><input id="retroactive" type="checkbox" onchange="toggleRetro()"> Retroactive?</label>
        <div id="retroGrid" class="grid retro-grid">
          <div>
            <label for="retroStart">Retroactive Start</label>
            <input id="retroStart" type="date">
          </div>
          <div>
            <label for="retroEnd">Retroactive End</label>
            <input id="retroEnd" type="date">
          </div>
          <div class="full">
            <label for="adjustmentPeriodId">Adjustment Pay Period</label>
            <select id="adjustmentPeriodId"></select>
          </div>
        </div>
      </div>

      <div class="grid">
        <div class="full">
          <label for="notes">Notes</label>
          <textarea id="notes"></textarea>
        </div>
      </div>

      <p id="status" class="status">Loading...</p>

      <div class="actions">
        <button type="button" onclick="google.script.host.close()">Cancel</button>
        <button id="saveButton" class="primary" type="submit">Save Change</button>
      </div>
    </form>

    <script>
      let currentFields = [];

      function init() {
        google.script.run
          .withSuccessHandler(data => {
            document.getElementById('employeeCode').innerHTML = (data.employees || [])
              .map(employee => `<option value="${escapeAttr(employee.employeeCode)}">${escapeHtml(employee.displayName)} (${escapeHtml(employee.employeeCode)})</option>`)
              .join('');
            document.getElementById('effectiveFrom').value = data.defaultEffectiveFrom || '';
            document.getElementById('adjustmentPeriodId').innerHTML = (data.periods || [])
              .map(period => {
                const label = `${period.periodId} | ${period.periodStart} to ${period.periodEnd} | ${period.status}`;
                return `<option value="${escapeAttr(period.periodId)}" ${period.periodId === data.defaultAdjustmentPeriodId ? 'selected' : ''}>${escapeHtml(label)}</option>`;
              })
              .join('');
            loadEmployee();
          })
          .withFailureHandler(showError)
          .getCompensationChangeDialogData();
      }

      function loadEmployee() {
        const employeeCode = value('employeeCode');
        if (!employeeCode) return;
        setStatus('Loading current compensation.');
        google.script.run
          .withSuccessHandler(data => {
            currentFields = data.fields || [];
            document.getElementById('compRows').innerHTML = currentFields.map(field => `
              <tr>
                <td>${escapeHtml(field.label)}</td>
                <td>${escapeHtml(field.value)}</td>
                <td>${renderFieldInput(field)}</td>
              </tr>
            `).join('');
            setStatus('Ready.');
          })
          .withFailureHandler(showError)
          .getCompensationChangeEmployeeData(employeeCode);
      }

	      function toggleRetro() {
	        document.getElementById('retroGrid').style.display = document.getElementById('retroactive').checked ? 'grid' : 'none';
	      }

	      function renderFieldInput(field) {
	        if (field.type === 'select') {
	          const options = [''].concat(field.options || []);
	          return `<select id="${escapeAttr(field.key)}">${options.map(option => (
	            `<option value="${escapeAttr(option)}">${escapeHtml(option || 'Leave blank to keep current')}</option>`
	          )).join('')}</select>`;
	        }
	        return `<input id="${escapeAttr(field.key)}" type="${field.type === 'number' ? 'number' : 'text'}" step="0.01" placeholder="Leave blank to keep current">`;
	      }

	      function submitForm(event) {
        event.preventDefault();
        const newComp = {};
        currentFields.forEach(field => {
          newComp[field.key] = value(field.key);
        });
        setBusy(true);
        setStatus('Saving compensation change.');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Saved.');
            setBusy(false);
          })
          .withFailureHandler(error => {
            showError(error);
            setBusy(false);
          })
          .saveCompensationChange({
            employeeCode: value('employeeCode'),
            effectiveFrom: value('effectiveFrom'),
            reason: value('reason'),
            notes: value('notes'),
            newComp,
            retroactive: document.getElementById('retroactive').checked,
            retroStart: value('retroStart'),
            retroEnd: value('retroEnd'),
            adjustmentPeriodId: value('adjustmentPeriodId')
          });
      }

      function value(id) {
        const node = document.getElementById(id);
        return node ? node.value.trim() : '';
      }

      function setBusy(isBusy) {
        document.getElementById('saveButton').disabled = isBusy;
      }

      function setStatus(message, isError) {
        const node = document.getElementById('status');
        node.textContent = message || '';
        node.className = isError ? 'status error' : 'status';
      }

      function showError(error) {
        setStatus(error && error.message ? error.message : String(error), true);
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#096;');
      }

      init();
    </script>
  </body>
</html>
