<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg-foundation: #F7F1EB;
        --surface-card: #FBF7F1;
        --surface-inset: #EFE8DD;
        --ink-primary: #2A2725;
        --ink-body: #4A4540;
        --ink-muted: #8A8178;
        --rule: #D4CFC4;
        --accent: #E91D79;
        --serif: 'Cormorant Garamond', Georgia, serif;
        --sans: 'Inter', system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-foundation);
        color: var(--ink-body);
        font: 14px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      form {
        padding: 28px 28px 0;
      }
      h2 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: -0.01em;
        color: var(--ink-primary);
        margin: 0 0 4px;
      }
      .eyebrow,
      label,
      button {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .eyebrow {
        color: var(--ink-muted);
        margin: 0 0 6px;
      }
      .section-head {
        margin-bottom: 18px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--rule);
      }
      .grid {
        display: grid;
        gap: 20px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: var(--ink-muted);
      }
      select, input {
        width: 100%;
        min-height: 38px;
        border: 0;
        border-bottom: 1px solid var(--rule);
        border-radius: 0;
        padding: 6px 2px;
        background: transparent;
        color: var(--ink-primary);
        font: inherit;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        appearance: none;
        -webkit-appearance: none;
      }
      select:focus, input:focus {
        outline: none;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 5px;
      }
      .note {
        margin: 24px 0 0;
        padding: 16px 18px;
        background: var(--surface-inset);
        border-top: 2px solid var(--accent);
        color: var(--ink-body);
        font-size: 13px;
      }
      .status {
        min-height: 22px;
        margin: 18px 0 0;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .error { color: var(--accent); }
      .actions {
        position: sticky;
        bottom: 0;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin: 28px -28px 0;
        padding: 18px 28px;
        border-top: 2px solid var(--accent);
        background: var(--bg-foundation);
      }
      button {
        min-height: 42px;
        padding: 0 22px;
        border: 1px solid var(--ink-primary);
        border-radius: 0;
        background: transparent;
        color: var(--ink-primary);
        font-family: var(--sans);
        cursor: pointer;
        transition: background-color 120ms ease, color 120ms ease;
      }
      button:hover:not(:disabled) {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      button.primary {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      button.primary:hover:not(:disabled) {
        background: var(--ink-primary);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <form onsubmit="submitForm(event)">
      <div class="section-head">
        <p class="eyebrow">Attendance Correction</p>
        <h2>Edit Attendance Status</h2>
      </div>

      <div class="grid">
        <div>
          <label for="employeeCode">Employee</label>
          <select id="employeeCode" required></select>
        </div>
        <div>
          <label for="date">Date</label>
          <input id="date" type="date" required>
        </div>
        <div>
          <label for="status">Status Override</label>
          <select id="status" required></select>
        </div>
      </div>

      <p class="note">Use manual clock events for time corrections. Status overrides are for PTO, UTO, Non-PTO, holidays, and manager-confirmed absence states.</p>
      <p id="message" class="status">Loading...</p>

      <div class="actions">
        <button type="button" onclick="google.script.host.close()">Cancel</button>
        <button id="saveButton" class="primary" type="submit">Save Status</button>
      </div>
    </form>

    <script>
      function init() {
        google.script.run
          .withSuccessHandler(data => {
            document.getElementById('employeeCode').innerHTML = data.employees
              .map(employee => `<option value="${escapeAttr(employee.employeeCode)}">${escapeHtml(employee.displayName)} (${escapeHtml(employee.employeeCode)})</option>`)
              .join('');
            document.getElementById('status').innerHTML = data.statuses
              .map(status => `<option value="${escapeAttr(status)}">${escapeHtml(status)}</option>`)
              .join('');
            document.getElementById('date').value = data.today || '';
            setStatus('');
          })
          .withFailureHandler(showError)
          .getEditAttendanceLogDialogData();
      }

      function submitForm(event) {
        event.preventDefault();
        setBusy(true);
        setStatus('Saving attendance status...');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Saved.');
            google.script.host.close();
          })
          .withFailureHandler(error => {
            showError(error);
            setBusy(false);
          })
          .editAttendanceLogEntry({
            employeeCode: value('employeeCode'),
            date: value('date'),
            status: value('status')
          });
      }

      function value(id) {
        return document.getElementById(id).value.trim();
      }

      function setBusy(isBusy) {
        document.getElementById('saveButton').disabled = isBusy;
      }

      function setStatus(message, isError) {
        const node = document.getElementById('message');
        node.textContent = message || '';
        node.className = isError ? 'status error' : 'status';
      }

      function showError(error) {
        setStatus(error && error.message ? error.message : String(error), true);
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#096;');
      }

      init();
    </script>
  </body>
</html>
