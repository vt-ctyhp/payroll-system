<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg-foundation: #F7F1EB;
        --surface-card: #FBF7F1;
        --surface-inset: #EFE8DD;
        --ink-primary: #2A2725;
        --ink-body: #4A4540;
        --ink-muted: #8A8178;
        --rule: #D4CFC4;
        --accent: #E91D79;
        --serif: 'Cormorant Garamond', Georgia, serif;
        --sans: 'Inter', system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-foundation);
        color: var(--ink-body);
        font: 14px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      form { padding: 28px 28px 0; }
      h2 {
        margin: 0;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 400;
        line-height: 1.15;
      }
      .eyebrow,
      label,
      button,
      .metric-label {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .eyebrow,
      label,
      .metric-label { color: var(--ink-muted); }
      .section-head {
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--rule);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 24px;
      }
      .full { grid-column: 1 / -1; }
      label { display: block; margin-bottom: 6px; }
      select,
      input,
      textarea {
        width: 100%;
        min-height: 38px;
        border: 0;
        border-bottom: 1px solid var(--rule);
        border-radius: 0;
        padding: 6px 2px;
        background: transparent;
        color: var(--ink-primary);
        font: inherit;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        appearance: none;
        -webkit-appearance: none;
      }
      select:focus,
      input:focus,
      textarea:focus {
        outline: none;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 5px;
      }
      textarea { min-height: 84px; resize: vertical; }
      .preview {
        margin: 26px 0 0;
        border: 1px solid var(--rule);
        background: var(--surface-inset);
      }
      .preview-head {
        padding: 16px 18px;
        border-bottom: 1px solid var(--rule);
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .metric {
        min-height: 88px;
        padding: 16px 18px;
        border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
      }
      .metric:nth-child(3n) { border-right: 0; }
      .metric-value {
        margin-top: 6px;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 24px;
        line-height: 1.05;
        font-variant-numeric: tabular-nums;
      }
      .note {
        padding: 14px 18px;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .status {
        min-height: 22px;
        margin: 18px 0 0;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .error { color: var(--accent); }
      .actions {
        position: sticky;
        bottom: 0;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin: 28px -28px 0;
        padding: 18px 28px;
        border-top: 2px solid var(--accent);
        background: var(--bg-foundation);
      }
      button {
        min-height: 42px;
        padding: 0 22px;
        border: 1px solid var(--ink-primary);
        border-radius: 0;
        background: transparent;
        color: var(--ink-primary);
        font-family: var(--sans);
        cursor: pointer;
      }
      button:hover:not(:disabled),
      button.primary {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <form onsubmit="submitForm(event)">
      <div class="section-head">
        <p class="eyebrow">Lifecycle Control</p>
        <h2>Offboard Employee</h2>
      </div>

      <div class="grid">
        <div class="full">
          <label for="employeeCode">Employee</label>
          <select id="employeeCode" onchange="loadPreview()" required></select>
        </div>
        <div>
          <label for="eventType">Type</label>
          <select id="eventType" required></select>
        </div>
        <div>
          <label for="lastWorkingDay">Last Working Day</label>
          <input id="lastWorkingDay" type="date" onchange="loadPreview()" required>
        </div>
        <div class="full">
          <label for="reason">Reason</label>
          <input id="reason" required>
        </div>
        <div class="full">
          <label for="notes">Notes</label>
          <textarea id="notes"></textarea>
        </div>
      </div>

      <div id="preview" class="preview">
        <div class="preview-head"><span class="metric-label">Final Payroll Preview</span></div>
        <div class="note">Select an employee and last working day.</div>
      </div>

      <p id="status" class="status">Loading...</p>

      <div class="actions">
        <button type="button" onclick="google.script.host.close()">Cancel</button>
        <button id="saveButton" class="primary" type="submit">Confirm Offboarding</button>
      </div>
    </form>

    <script>
      function init() {
        google.script.run
          .withSuccessHandler(data => {
            document.getElementById('employeeCode').innerHTML = (data.employees || [])
              .map(employee => `<option value="${escapeAttr(employee.employeeCode)}">${escapeHtml(employee.displayName)} (${escapeHtml(employee.employeeCode)})</option>`)
              .join('');
            document.getElementById('eventType').innerHTML = (data.eventTypes || [])
              .map(type => `<option value="${escapeAttr(type)}">${escapeHtml(type)}</option>`)
              .join('');
            document.getElementById('lastWorkingDay').value = data.today || '';
            setStatus('Ready.');
            loadPreview();
          })
          .withFailureHandler(showError)
          .getOffboardDialogData();
      }

      function loadPreview() {
        if (!value('employeeCode') || !value('lastWorkingDay')) return;
        google.script.run
          .withSuccessHandler(renderPreview)
          .withFailureHandler(showError)
          .getOffboardPreview({
            employeeCode: value('employeeCode'),
            lastWorkingDay: value('lastWorkingDay')
          });
      }

      function renderPreview(preview) {
        document.getElementById('preview').innerHTML = `
          <div class="preview-head"><span class="metric-label">${escapeHtml(preview.finalPeriodId)} | ${escapeHtml(preview.periodStart)} to ${escapeHtml(preview.periodEnd)}</span></div>
          <div class="metrics">
            ${metric('Benefits Preview', money(preview.benefitPreview))}
            ${metric('Attendance Bonus', preview.attendanceBonus)}
            ${metric('KPI Proration', money(preview.kpi && preview.kpi.proratedAmount))}
            ${metric('Eligible Days', `${preview.eligibleDays || 0}/${preview.scheduledInMonth || 0}`)}
            ${metric('Source Period', preview.sourcePeriodId || 'None')}
            ${metric('PTO Payout', money(preview.ptoPayout))}
          </div>
          <div class="note">${escapeHtml(preview.kpi ? preview.kpi.note : '')}<br>${escapeHtml(preview.ptoPayoutNote || '')}</div>
        `;
      }

      function metric(label, value) {
        return `<div class="metric"><div class="metric-label">${escapeHtml(label)}</div><div class="metric-value">${escapeHtml(value == null || value === '' ? 'Blank' : value)}</div></div>`;
      }

      function submitForm(event) {
        event.preventDefault();
        setBusy(true);
        setStatus('Creating final payroll.');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Offboarding complete.');
            setBusy(false);
          })
          .withFailureHandler(error => {
            showError(error);
            setBusy(false);
          })
          .offboardEmployee({
            employeeCode: value('employeeCode'),
            eventType: value('eventType'),
            lastWorkingDay: value('lastWorkingDay'),
            reason: value('reason'),
            notes: value('notes')
          });
      }

      function money(value) {
        const number = Number(value);
        return Number.isFinite(number) ? `$${number.toFixed(2)}` : 'Blank';
      }

      function value(id) {
        const node = document.getElementById(id);
        return node ? node.value.trim() : '';
      }

      function setBusy(isBusy) {
        document.getElementById('saveButton').disabled = isBusy;
      }

      function setStatus(message, isError) {
        const node = document.getElementById('status');
        node.textContent = message || '';
        node.className = isError ? 'status error' : 'status';
      }

      function showError(error) {
        setStatus(error && error.message ? error.message : String(error), true);
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#096;');
      }

      init();
    </script>
  </body>
</html>
