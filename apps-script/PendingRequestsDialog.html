<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg-foundation: #F7F1EB;
        --surface-card: #FBF7F1;
        --surface-inset: #EFE8DD;
        --ink-primary: #2A2725;
        --ink-body: #4A4540;
        --ink-muted: #8A8178;
        --rule: #D4CFC4;
        --accent: #E91D79;
        --serif: 'Cormorant Garamond', Georgia, serif;
        --sans: 'Inter', system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-foundation);
        color: var(--ink-body);
        font: 14px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      form { padding: 28px 28px 0; }
      h2,
      h3 {
        margin: 0;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-weight: 400;
        line-height: 1.15;
      }
      h2 { font-size: 24px; }
      h3 {
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid var(--rule);
        font-size: 20px;
      }
      .eyebrow,
      label,
      button,
      th,
      .code,
      .meta {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .eyebrow,
      label,
      th,
      .code,
      .meta {
        color: var(--ink-muted);
      }
      .section-head {
        margin-bottom: 18px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--rule);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 14px;
      }
      th,
      td {
        padding: 11px 9px;
        border-bottom: 1px solid var(--rule);
        text-align: left;
        vertical-align: top;
      }
      th {
        border-top: 1px solid var(--rule);
        background: var(--surface-inset);
      }
      td {
        font-variant-numeric: tabular-nums;
      }
      select,
      input {
        width: 100%;
        min-height: 36px;
        border: 0;
        border-bottom: 1px solid var(--rule);
        border-radius: 0;
        padding: 6px 2px;
        background: transparent;
        color: var(--ink-primary);
        font: inherit;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
        appearance: none;
        -webkit-appearance: none;
      }
      select:focus,
      input:focus {
        outline: none;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 5px;
      }
      .code {
        display: block;
        margin-top: 2px;
      }
      .reason {
        max-width: 260px;
      }
      .empty {
        margin: 18px 0 0;
        padding: 18px;
        background: var(--surface-inset);
        border: 1px solid var(--rule);
        color: var(--ink-muted);
      }
      .balance {
        color: var(--ink-muted);
        font-size: 12px;
      }
      .status {
        min-height: 22px;
        margin: 18px 0 0;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .error { color: var(--accent); }
      .actions {
        position: sticky;
        bottom: 0;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin: 28px -28px 0;
        padding: 18px 28px;
        border-top: 2px solid var(--accent);
        background: var(--bg-foundation);
      }
      button {
        min-height: 42px;
        padding: 0 22px;
        border: 1px solid var(--ink-primary);
        border-radius: 0;
        background: transparent;
        color: var(--ink-primary);
        font-family: var(--sans);
        cursor: pointer;
      }
      button:hover:not(:disabled),
      button.primary {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <form onsubmit="submitForm(event)">
      <div class="section-head">
        <p class="eyebrow">Manager Approval</p>
        <h2>Time Off &amp; Makeup Requests</h2>
        <p id="meta" class="meta"></p>
      </div>

      <div id="content">
        <p class="empty">Loading requests...</p>
      </div>

      <p id="status" class="status">Loading...</p>

      <div class="actions">
        <button type="button" onclick="google.script.host.close()">Cancel</button>
        <button id="saveButton" class="primary" type="submit">Save Decisions</button>
      </div>
    </form>

    <script>
      function init() {
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(showError)
          .getPendingRequestsDialogData();
      }

      function render(data) {
        const timeOff = data.timeOffRequests || [];
        const makeup = data.makeupRequests || [];
        document.getElementById('meta').textContent = data.requestedAt ? `Loaded ${data.requestedAt}` : '';
        if (!timeOff.length && !makeup.length) {
          document.getElementById('content').innerHTML = '<p class="empty">No pending requests.</p>';
          setStatus('Ready.');
          return;
        }
        document.getElementById('content').innerHTML = `
          ${renderTimeOff(timeOff)}
          ${renderMakeup(makeup)}
        `;
        setStatus('Ready.');
      }

      function renderTimeOff(rows) {
        if (!rows.length) return '<h3>Time Off</h3><p class="empty">No pending time off requests.</p>';
        return `
          <h3>Time Off</h3>
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Request</th>
                <th>Reason</th>
                <th>Balance</th>
                <th>Decision</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr data-kind="timeOff" data-id="${escapeAttr(row.requestId)}">
                  <td>${escapeHtml(row.employee)}<span class="code">${escapeHtml(row.employeeCode)}</span></td>
                  <td>${escapeHtml(row.type)}<span class="code">${escapeHtml(row.startDate)} to ${escapeHtml(row.endDate)} | ${escapeHtml(row.units)} unit(s)</span></td>
                  <td class="reason">${escapeHtml(row.reason)}</td>
                  <td class="balance">${formatBalance(row.balance)}</td>
                  <td>${decisionSelect()}</td>
                  <td><input class="notes" placeholder="Optional approval note"></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      function renderMakeup(rows) {
        if (!rows.length) return '<h3>Makeup Hours</h3><p class="empty">No pending makeup hour requests.</p>';
        return `
          <h3>Makeup Hours</h3>
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Date</th>
                <th>Hours</th>
                <th>Reason</th>
                <th>Decision</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr data-kind="makeup" data-id="${escapeAttr(row.requestId)}">
                  <td>${escapeHtml(row.employee)}<span class="code">${escapeHtml(row.employeeCode)}</span></td>
                  <td>${escapeHtml(row.date)}</td>
                  <td>${escapeHtml(row.hours)}</td>
                  <td class="reason">${escapeHtml(row.reason)}</td>
                  <td>${decisionSelect()}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      function decisionSelect() {
        return `
          <select class="decision">
            <option value="Keep">Keep Pending</option>
            <option value="Approved">Approve</option>
            <option value="Denied">Deny</option>
          </select>
        `;
      }

      function submitForm(event) {
        event.preventDefault();
        const decisions = Array.from(document.querySelectorAll('tr[data-kind]')).map(row => ({
          kind: row.dataset.kind,
          requestId: row.dataset.id,
          decision: row.querySelector('.decision').value,
          notes: row.querySelector('.notes') ? row.querySelector('.notes').value.trim() : ''
        })).filter(row => row.decision !== 'Keep');
        if (!decisions.length) {
          setStatus('Choose at least one approval or denial.', true);
          return;
        }
        setBusy(true);
        setStatus('Saving decisions.');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Decisions saved.');
            setBusy(false);
            init();
          })
          .withFailureHandler(error => {
            showError(error);
            setBusy(false);
          })
          .processPendingRequests({ decisions });
      }

      function formatBalance(balance) {
        if (!balance) return 'Balance blank';
        return `${balance.ptoPlanType || 'PTO'} | earned ${formatNumber(balance.earnedPto)} | remaining ${formatNumber(balance.remainingPto)} | Non-PTO ${formatNumber(balance.remainingNonPto)}`;
      }

      function formatNumber(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number.toFixed(2) : 'blank';
      }

      function setBusy(isBusy) {
        document.getElementById('saveButton').disabled = isBusy;
      }

      function setStatus(message, isError) {
        const node = document.getElementById('status');
        node.textContent = message || '';
        node.className = isError ? 'status error' : 'status';
      }

      function showError(error) {
        setStatus(error && error.message ? error.message : String(error), true);
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#096;');
      }

      init();
    </script>
  </body>
</html>
