<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg-foundation: #F7F1EB;
        --surface-card: #FBF7F1;
        --surface-inset: #EFE8DD;
        --ink-primary: #2A2725;
        --ink-body: #4A4540;
        --ink-muted: #8A8178;
        --rule: #D4CFC4;
        --accent: #E91D79;
        --serif: 'Cormorant Garamond', Georgia, serif;
        --sans: 'Inter', system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-foundation);
        color: var(--ink-body);
        font: 14px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      form { padding: 28px 28px 0; }
      h2 {
        margin: 0;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 400;
        line-height: 1.15;
      }
      .eyebrow,
      label,
      button,
      .metric-label {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .eyebrow,
      label,
      .metric-label {
        color: var(--ink-muted);
      }
      .section-head {
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--rule);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .full { grid-column: 1 / -1; }
      label {
        display: block;
        margin-bottom: 6px;
      }
      select,
      input,
      textarea {
        width: 100%;
        min-height: 38px;
        border: 0;
        border-bottom: 1px solid var(--rule);
        border-radius: 0;
        padding: 6px 2px;
        background: transparent;
        color: var(--ink-primary);
        font: inherit;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        appearance: none;
        -webkit-appearance: none;
      }
      select:focus,
      input:focus,
      textarea:focus {
        outline: none;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 5px;
      }
      textarea {
        min-height: 104px;
        resize: vertical;
      }
      input[type="checkbox"] {
        width: 16px;
        min-height: auto;
        height: 16px;
        margin: 0 8px 0 0;
        accent-color: var(--accent);
        vertical-align: middle;
      }
      input:disabled {
        color: var(--ink-muted);
      }
      .balance {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        margin: 2px 0 4px;
        background: var(--rule);
        border: 1px solid var(--rule);
      }
      .metric {
        min-height: 76px;
        padding: 14px;
        background: var(--surface-inset);
      }
      .metric-value {
        margin-top: 6px;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 26px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      .status {
        min-height: 22px;
        margin: 18px 0 0;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .error { color: var(--accent); }
      .actions {
        position: sticky;
        bottom: 0;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin: 28px -28px 0;
        padding: 18px 28px;
        border-top: 2px solid var(--accent);
        background: var(--bg-foundation);
      }
      button {
        min-height: 42px;
        padding: 0 22px;
        border: 1px solid var(--ink-primary);
        border-radius: 0;
        background: transparent;
        color: var(--ink-primary);
        font-family: var(--sans);
        cursor: pointer;
      }
      button:hover:not(:disabled),
      button.primary {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <form onsubmit="submitForm(event)">
      <div class="section-head">
        <p class="eyebrow">Employee Request</p>
        <h2>Time Off</h2>
      </div>

      <div class="grid">
        <div class="full">
          <label for="employeeCode">Employee</label>
          <select id="employeeCode" onchange="renderBalance()" required></select>
        </div>
        <div class="full">
          <div class="balance">
            <div class="metric">
              <div class="metric-label">PTO Plan</div>
              <div id="ptoPlanType" class="metric-value">Blank</div>
            </div>
            <div class="metric">
              <div class="metric-label">PTO Earned Hours</div>
              <div id="ptoEarned" class="metric-value">Blank</div>
            </div>
            <div class="metric">
              <div class="metric-label">PTO Remaining Hours</div>
              <div id="ptoRemaining" class="metric-value">Blank</div>
            </div>
            <div class="metric">
              <div class="metric-label">Non-PTO Remaining Hours</div>
              <div id="nonPtoRemaining" class="metric-value">Blank</div>
            </div>
          </div>
        </div>
        <div>
          <label for="type">Type</label>
          <select id="type" onchange="schedulePreview()" required></select>
        </div>
        <div>
          <label><input id="fullDay" type="checkbox" onchange="toggleTimeFields(); schedulePreview()" checked> Full Day</label>
        </div>
        <div>
          <label for="startDate">Start Date</label>
          <input id="startDate" type="date" onchange="schedulePreview()" required>
        </div>
        <div>
          <label for="endDate">End Date</label>
          <input id="endDate" type="date" onchange="schedulePreview()" required>
        </div>
        <div>
          <label for="startTime">Start Time</label>
          <input id="startTime" placeholder="10:00am" oninput="schedulePreview()">
        </div>
        <div>
          <label for="endTime">End Time</label>
          <input id="endTime" placeholder="02:00pm" oninput="schedulePreview()">
        </div>
        <div class="full">
          <div class="balance">
            <div class="metric">
              <div class="metric-label">Requested Hours</div>
              <div id="requestedHoursPreview" class="metric-value">Blank</div>
            </div>
            <div class="metric">
              <div class="metric-label">Calculation</div>
              <div id="calculationNote" class="metric-value">Blank</div>
            </div>
          </div>
        </div>
        <div class="full">
          <label for="reason">Reason</label>
          <textarea id="reason" required></textarea>
        </div>
      </div>

      <p id="status" class="status">Loading...</p>

      <div class="actions">
        <button type="button" onclick="google.script.host.close()">Cancel</button>
        <button id="saveButton" class="primary" type="submit">Submit Request</button>
      </div>
    </form>

    <script>
      let balances = {};

      function init() {
        google.script.run
          .withSuccessHandler(data => {
            balances = data.balances || {};
            document.getElementById('employeeCode').innerHTML = (data.employees || [])
              .map(employee => `<option value="${escapeAttr(employee.employeeCode)}">${escapeHtml(employee.displayName)} (${escapeHtml(employee.employeeCode)})</option>`)
              .join('');
            document.getElementById('type').innerHTML = (data.types || [])
              .map(type => `<option value="${escapeAttr(type)}">${escapeHtml(type)}</option>`)
              .join('');
            document.getElementById('startDate').value = data.today || '';
            document.getElementById('endDate').value = data.today || '';
            renderBalance();
            toggleTimeFields();
            schedulePreview();
            setStatus('Ready.');
          })
          .withFailureHandler(showError)
          .getTimeOffRequestDialogData();
      }

      function renderBalance() {
        const balance = balances[value('employeeCode')] || {};
        document.getElementById('ptoPlanType').textContent = balance.ptoPlanType || 'Blank';
        document.getElementById('ptoEarned').textContent = formatBalance(balance.earnedPto);
        document.getElementById('ptoRemaining').textContent = formatBalance(balance.remainingPto);
        document.getElementById('nonPtoRemaining').textContent = formatBalance(balance.remainingNonPto);
        schedulePreview();
      }

      function toggleTimeFields() {
        const fullDay = document.getElementById('fullDay').checked;
        document.getElementById('startTime').disabled = fullDay;
        document.getElementById('endTime').disabled = fullDay;
      }

      let previewTimer = null;
      function schedulePreview() {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(updatePreview, 250);
      }

      function updatePreview() {
        if (!value('employeeCode') || !value('startDate') || !value('endDate')) return;
        if (!document.getElementById('fullDay').checked && (!value('startTime') || !value('endTime'))) {
          document.getElementById('requestedHoursPreview').textContent = 'Blank';
          document.getElementById('calculationNote').textContent = 'Enter start and end time.';
          return;
        }
        google.script.run
          .withSuccessHandler(result => {
            document.getElementById('requestedHoursPreview').textContent = formatBalance(result.requestedHours);
            document.getElementById('calculationNote').textContent = result.note || 'Ready.';
          })
          .withFailureHandler(error => {
            document.getElementById('requestedHoursPreview').textContent = 'Blank';
            document.getElementById('calculationNote').textContent = error && error.message ? error.message : String(error);
          })
          .previewTimeOffRequest({
            employeeCode: value('employeeCode'),
            type: value('type'),
            startDate: value('startDate'),
            endDate: value('endDate'),
            startTime: value('startTime'),
            endTime: value('endTime'),
            fullDay: document.getElementById('fullDay').checked ? 'Yes' : 'No'
          });
      }

      function submitForm(event) {
        event.preventDefault();
        setBusy(true);
        setStatus('Submitting request.');
        google.script.run
          .withSuccessHandler(result => {
            setStatus(result.message || 'Request submitted.');
            setBusy(false);
          })
          .withFailureHandler(error => {
            showError(error);
            setBusy(false);
          })
          .submitTimeOffRequest({
            employeeCode: value('employeeCode'),
            type: value('type'),
            startDate: value('startDate'),
            endDate: value('endDate'),
            startTime: value('startTime'),
            endTime: value('endTime'),
            fullDay: document.getElementById('fullDay').checked ? 'Yes' : 'No',
            reason: value('reason')
          });
      }

      function value(id) {
        const node = document.getElementById(id);
        return node ? node.value.trim() : '';
      }

      function setBusy(isBusy) {
        document.getElementById('saveButton').disabled = isBusy;
      }

      function setStatus(message, isError) {
        const node = document.getElementById('status');
        node.textContent = message || '';
        node.className = isError ? 'status error' : 'status';
      }

      function showError(error) {
        setStatus(error && error.message ? error.message : String(error), true);
      }

      function formatBalance(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number.toFixed(2) : 'Blank';
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#096;');
      }

      init();
    </script>
  </body>
</html>
