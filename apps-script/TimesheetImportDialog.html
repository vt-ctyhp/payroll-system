<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg-foundation: #F7F1EB;
        --surface-card: #FBF7F1;
        --surface-inset: #EFE8DD;
        --ink-primary: #2A2725;
        --ink-body: #4A4540;
        --ink-muted: #8A8178;
        --rule: #D4CFC4;
        --accent: #E91D79;
        --serif: 'Cormorant Garamond', Georgia, serif;
        --sans: 'Inter', system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-foundation);
        color: var(--ink-body);
        font: 14px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      form {
        padding: 28px 28px 0;
      }
      h2 {
        margin: 0 0 4px;
        color: var(--ink-primary);
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 400;
        line-height: 1.2;
      }
      .eyebrow {
        margin: 0 0 6px;
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .section-head {
        margin-bottom: 22px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--rule);
      }
      .section {
        margin-top: 28px;
      }
      .section:first-of-type {
        margin-top: 0;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      input[type="file"], textarea {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--rule);
        border-radius: 0;
        background: transparent;
        color: var(--ink-primary);
        font: inherit;
        font-size: 14px;
      }
      input[type="file"] {
        min-height: 38px;
        padding: 8px 2px;
      }
      textarea {
        min-height: 260px;
        padding: 10px 2px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre;
      }
      input[type="file"]:focus, textarea:focus {
        outline: none;
        border-bottom: 2px solid var(--accent);
      }
      textarea:focus {
        padding-bottom: 9px;
      }
      .helper {
        margin: 6px 0 0;
        color: var(--ink-muted);
        font-size: 12px;
      }
      .option {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--rule);
      }
      .option input {
        width: 16px;
        height: 16px;
        margin: 2px 0 0;
        accent-color: var(--accent);
      }
      .option label {
        margin: 0;
        color: var(--ink-primary);
        font-size: 13px;
        letter-spacing: 0;
        line-height: 1.4;
        text-transform: none;
      }
      .status {
        min-height: 22px;
        margin: 18px 0 0;
        color: var(--ink-muted);
        font-size: 13px;
      }
      .status.error {
        color: var(--accent);
      }
      .result {
        display: none;
        margin-top: 14px;
        padding: 14px;
        border: 1px solid var(--rule);
        background: var(--surface-inset);
        color: var(--ink-body);
        font-size: 12px;
        white-space: pre-wrap;
      }
      .actions {
        position: sticky;
        bottom: 0;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin: 28px -28px 0;
        padding: 18px 28px;
        border-top: 2px solid var(--accent);
        background: var(--bg-foundation);
      }
      button {
        min-height: 42px;
        padding: 0 22px;
        border: 1px solid var(--ink-primary);
        border-radius: 0;
        background: transparent;
        color: var(--ink-primary);
        font: inherit;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background-color 120ms ease, color 120ms ease;
      }
      button:hover:not(:disabled) {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      button.primary {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }
      button.primary:hover:not(:disabled) {
        background: var(--accent);
        border-color: var(--accent);
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <form id="importForm" onsubmit="submitImport(event)">
      <div class="section">
        <div class="section-head">
          <p class="eyebrow">Data Migration</p>
          <h2>Real Timesheet Import</h2>
        </div>
        <div class="field">
          <label for="csvFile">Timesheet File</label>
          <input id="csvFile" type="file" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" onchange="readSelectedFile()">
          <p class="helper">CSV contents preview below. Excel workbooks are read during import.</p>
        </div>
      </div>

      <div class="section">
        <label for="csvText">Raw CSV</label>
        <textarea id="csvText" spellcheck="false"></textarea>
      </div>

      <div class="section">
        <p class="eyebrow">Import Scope</p>
        <div class="option">
          <input id="removePhase1TestData" type="checkbox" checked>
          <label for="removePhase1TestData">Remove Phase 1 fake clock events and test payroll rows before importing.</label>
        </div>
        <div class="option">
          <input id="calculatePayroll" type="checkbox" checked>
          <label for="calculatePayroll">Calculate payroll after rebuilding attendance when the file covers exactly one pay period.</label>
        </div>
      </div>

      <p id="status" class="status"></p>
      <div id="result" class="result"></div>

      <div class="actions">
        <button type="button" onclick="google.script.host.close()">Cancel</button>
        <button id="importButton" class="primary" type="submit">Import Timesheet</button>
      </div>
    </form>

    <script>
      let selectedWorkbook = null;

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') google.script.host.close();
      });

      function readSelectedFile() {
        const file = document.getElementById('csvFile').files[0];
        if (!file) return;
        const reader = new FileReader();
        const isWorkbook = /\.xlsx$/i.test(file.name) || file.type === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
        setStatus(isWorkbook ? 'Reading Excel workbook...' : 'Reading CSV file...');
        reader.onload = event => {
          if (isWorkbook) {
            const dataUrl = String(event.target.result || '');
            selectedWorkbook = {
              fileName: file.name,
              mimeType: file.type,
              fileBase64: dataUrl.split(',')[1] || ''
            };
            document.getElementById('csvText').value = '';
            document.getElementById('csvText').placeholder = `${file.name} loaded as an Excel workbook.`;
            setStatus('Excel workbook loaded.');
            return;
          }
          selectedWorkbook = null;
          document.getElementById('csvText').placeholder = '';
          document.getElementById('csvText').value = event.target.result || '';
          setStatus('CSV loaded.');
        };
        reader.onerror = () => setStatus('Could not read the selected file.', true);
        if (isWorkbook) reader.readAsDataURL(file);
        else reader.readAsText(file);
      }

      function submitImport(event) {
        event.preventDefault();
        const csvText = document.getElementById('csvText').value.trim();
        if (!csvText && !selectedWorkbook) {
          setStatus('Select an Excel workbook or paste the raw timesheet CSV.', true);
          return;
        }
        setBusy(true);
        setStatus('Importing timesheet data...');
        document.getElementById('result').style.display = 'none';
        google.script.run
          .withSuccessHandler(result => {
            setBusy(false);
            setStatus(result.message || 'Timesheet imported.');
            showResult(result);
          })
          .withFailureHandler(error => {
            setBusy(false);
            setStatus(error && error.message ? error.message : String(error), true);
          })
          .importTimesheetCsvFromDialog({
            csvText,
            fileName: selectedWorkbook ? selectedWorkbook.fileName : '',
            fileMimeType: selectedWorkbook ? selectedWorkbook.mimeType : '',
            fileBase64: selectedWorkbook ? selectedWorkbook.fileBase64 : '',
            removePhase1TestData: document.getElementById('removePhase1TestData').checked,
            calculatePayroll: document.getElementById('calculatePayroll').checked
          });
      }

      function showResult(result) {
        const lines = [
          `Date range: ${result.dateRange}`,
          `Source rows: ${result.sourceRowsRead}`,
          `Employees added: ${result.employeesAdded}`,
          `Schedules replaced: ${result.scheduleRowsRemoved} removed, ${result.scheduleRowsAdded} added`,
          `Clock events: ${result.fakeEventsRemoved + result.priorImportEventsRemoved} removed, ${result.eventsAdded} added`,
          `Attendance rows rebuilt: ${result.attendanceRowsWritten}`
        ];
        if (result.payrollMessage) lines.push(`Payroll: ${result.payrollMessage}`);
        if (result.payrollError) lines.push(`Payroll warning: ${result.payrollError}`);
        if (result.payrollWarnings && result.payrollWarnings.length) {
          lines.push('');
          lines.push('Payroll warnings:');
          result.payrollWarnings.slice(0, 8).forEach(warning => lines.push(`- ${warning}`));
          if (result.payrollWarnings.length > 8) lines.push(`- ${result.payrollWarnings.length - 8} more warning(s) in the Apps Script log.`);
        }
        const resultNode = document.getElementById('result');
        resultNode.textContent = lines.join('\n');
        resultNode.style.display = 'block';
      }

      function setBusy(isBusy) {
        document.getElementById('importButton').disabled = isBusy;
      }

      function setStatus(message, isError) {
        const node = document.getElementById('status');
        node.textContent = message || '';
        node.className = isError ? 'status error' : 'status';
      }
    </script>
  </body>
</html>
